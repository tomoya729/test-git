<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>生命保険 試験対策</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#172033;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}.app{max-width:850px;margin:auto;padding:14px 14px 50px}.hero{background:#172033;color:#fff;border-radius:20px;padding:22px;margin-bottom:14px}.hero h1{margin:0 0 6px}.hero p{margin:0;line-height:1.6;opacity:.9}.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 3px 14px #0001}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:11px;padding:12px;font-size:15px;font-weight:700;cursor:pointer}.primary{background:#172033;color:#fff}.secondary{background:#e7eaf0;color:#172033}.oni{background:#8b1e1e;color:#fff}.choice{display:block;width:100%;text-align:left;background:#fff;border:2px solid #e2e6ed;margin:9px 0;padding:14px;border-radius:12px;cursor:pointer;font-size:15px;line-height:1.55}.choice.correct{border-color:#16934a;background:#effbf4}.choice.wrong{border-color:#d83b3b;background:#fff1f1}.choice:disabled{cursor:default}.hidden{display:none!important}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.badge{display:inline-block;background:#e7eaf0;border-radius:99px;padding:5px 9px;font-size:12px}.progress{height:9px;background:#e2e6ed;border-radius:99px;overflow:hidden;margin:12px 0}.progress i{display:block;height:100%;background:#172033;width:0}.timer{font-size:20px;font-weight:800}.timer.warn{color:#b42318}.notice{font-size:13px;background:#fff8df;border:1px solid #f0d77a;border-radius:10px;padding:11px;line-height:1.6}.oniNotice{background:#fff0f0;border-color:#e4a0a0}.stat{font-size:28px;font-weight:800}.muted{color:#667085;font-size:13px}.score{text-align:center}.score strong{font-size:48px}.review{padding:12px 0;border-bottom:1px solid #e3e6eb;line-height:1.7}.detail{background:#f7f8fa;border-radius:14px;padding:16px;margin-top:12px;line-height:1.9}.detail h3{margin:0 0 8px}.detail .answer{font-weight:800}.formula{background:#fff;border:1px solid #dfe3e8;border-radius:10px;padding:12px;font-family:ui-monospace,monospace;white-space:pre-wrap}.calcWrap{margin-top:16px}.calcBox{max-width:330px;margin:10px auto 0;background:#20242c;border-radius:18px;padding:14px;box-shadow:0 5px 18px #0002}.calcDisplay{width:100%;height:56px;border:0;border-radius:10px;background:#fff;text-align:right;padding:8px 12px;font-size:26px;font-family:ui-monospace,monospace;margin-bottom:10px}.calcKeys{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.calcKeys button{height:52px;border:0;border-radius:10px;font-size:19px;font-weight:700;cursor:pointer;background:#f1f3f6;color:#172033}.calcKeys button.op{background:#dfe5ef}.calcKeys button.eq{background:#172033;color:#fff}.calcKeys button.clear{grid-column:span 2}.footer{font-size:12px;color:#667085;text-align:center;margin-top:20px;line-height:1.6}@media(max-width:560px){.grid{grid-template-columns:1fr}.hero h1{font-size:21px}}
</style>
</head>
<body>
<main class="app">
<header class="hero"><h1>📝 生命保険 試験対策</h1><p>専門課程・変額保険販売資格を、実戦レベルのオリジナル問題で攻略。</p></header>
<section id="home" class="card"><h2>🔥 実戦演習</h2><div class="notice">問題文・選択肢・計算問題は独自作成しています。</div><button id="resumeBtn" class="btn primary hidden" style="width:100%;margin:12px 0" onclick="loadProgress()">▶️ 前回の続きから再開</button><h3>専門課程</h3><div class="grid"><button class="btn primary" onclick="start('専門課程','random',10)">10問 練習</button><button class="btn primary" onclick="start('専門課程','random',25)">25問 練習</button><button class="btn primary" onclick="start('専門課程','calc',15)">🧮 計算問題</button><button class="btn primary" onclick="startExam('専門課程')">⏱ 本番モード</button></div><h3>変額保険販売資格</h3><div class="grid"><button class="btn secondary" onclick="start('変額保険販売資格','random',10)">10問 練習</button><button class="btn secondary" onclick="start('変額保険販売資格','random',25)">25問 練習</button><button class="btn secondary" onclick="start('変額保険販売資格','calc',10)">🧮 計算問題</button><button class="btn secondary" onclick="startExam('変額保険販売資格')">⏱ 本番モード</button></div><h3>苦手対策</h3><div class="grid"><button class="btn secondary" onclick="start('専門課程','weak',20)">専門課程 苦手</button><button class="btn secondary" onclick="start('変額保険販売資格','weak',20)">変額資格 苦手</button></div><h3>👹 鬼モード</h3><div class="notice oniNotice">鬼専用問題・難易度6以上・複合論点問題を中心に出題。20問・15分。</div><div class="grid"><button class="btn oni" onclick="start('専門課程','oni',20)">👹 専門課程 鬼20問</button><button class="btn oni" onclick="start('変額保険販売資格','oni',20)">👹 変額資格 鬼20問</button></div></section>
<section class="card"><div class="top"><h2>📊 学習成績</h2><button class="btn secondary" onclick="showStats()">詳細</button></div><div class="grid"><div><div class="stat" id="totalCorrect">0%</div><div class="muted">総合正解率</div></div><div><div class="stat" id="attempts">0</div><div class="muted">解答数</div></div></div></section>
<section id="quiz" class="card hidden"><button id="saveBtn" class="btn secondary" style="width:100%;margin-bottom:12px" onclick="saveProgress()">💾 保存してホームへ</button><div class="top"><span id="examBadge" class="badge"></span><strong id="counter"></strong><span id="timer" class="timer hidden">80:00</span></div><div class="progress"><i id="progress"></i></div><h2 id="question"></h2><div id="choices"></div><div id="calcWrap" class="calcWrap hidden"><button id="calcToggle" class="btn secondary" style="width:100%" onclick="toggleCalc()">🧮 電卓を表示</button><div id="calculator" class="calcBox hidden"><input id="calcDisplay" class="calcDisplay" value="0" readonly><div class="calcKeys"><button class="clear" onclick="calcClear()">AC</button><button onclick="calcBack()">←</button><button class="op" onclick="calcInput('/')">÷</button><button onclick="calcInput('7')">7</button><button onclick="calcInput('8')">8</button><button onclick="calcInput('9')">9</button><button class="op" onclick="calcInput('*')">×</button><button onclick="calcInput('4')">4</button><button onclick="calcInput('5')">5</button><button onclick="calcInput('6')">6</button><button class="op" onclick="calcInput('-')">−</button><button onclick="calcInput('1')">1</button><button onclick="calcInput('2')">2</button><button onclick="calcInput('3')">3</button><button class="op" onclick="calcInput('+')">＋</button><button onclick="calcInput('0')">0</button><button onclick="calcInput('.')">.</button><button class="eq" onclick="calcEqual()">=</button></div></div></div><div id="explanation" class="hidden"></div><button id="detailBtn" class="btn secondary hidden" style="width:100%;margin-top:12px" onclick="showDetailedExplanation()">📖 詳しい解説を見る</button><button id="next" class="btn primary hidden" style="width:100%;margin-top:12px" onclick="nextQuestion()">次の問題</button></section>
<section id="detailPage" class="card hidden"><div class="top"><span class="badge">📖 詳細解説</span><span id="detailNo"></span></div><div id="detailBody"></div><div class="grid" style="margin-top:14px"><button class="btn secondary" onclick="backToQuiz()">← 問題に戻る</button><button class="btn primary" onclick="nextQuestion()">次の問題 →</button></div></section>
<section id="result" class="card hidden score"><h2>🎉 結果</h2><strong id="score"></strong><p id="resultText"></p><button class="btn primary" onclick="backHome()">ホームへ</button></section>
<section id="stats" class="card hidden"><h2>📊 成績詳細</h2><div id="statsBody"></div><button id="statsBack" class="btn secondary" onclick="backHome()">戻る</button></section>
<div class="footer">※制度・税制・試験形式は変更される場合があります。受験時は所属会社の研修資料・生命保険協会の最新情報を優先してください。</div>
</main>
<script src="questions.js"></script><script src="questions2.js"></script><script src="questions3.js"></script><script src="questions4.js"></script><script src="questions5.js"></script><script src="questions6.js"></script><script src="questions7.js"></script><script src="questions8.js"></script><script src="questions9.js"></script>
<script>
const questions=[...(window.questionExtras||[]),...(window.questionExtras2||[]),...(window.questionExtras3||[]),...(window.questionExtras4||[]),...(window.questionExtras5||[]),...(window.questionExtras6||[]),...(window.questionExtras7||[]),...(window.questionExtras8||[]),...(window.questionExtras9||[])];
function cleanQuestionText(text){return String(text||'').replace(/\s*##?\s*[（(]\s*確認問題\s*[^）)]*[）)]\s*/giu,' ').replace(/\s*[（(]\s*確認問題\s*[^）)]*[）)]\s*/giu,' ').replace(/\s*[【\[]\s*難問演習\s*[^】\]】]*[】\]]\s*/giu,' ').replace(/\s*【\s*難問演習[^】]*】\s*/giu,' ').replace(/^\s*##\s*/,'').replace(/\s{2,}/g,' ').trim()}
let state={list:[],index:0,correct:0,answers:[],exam:'',practice:false,mode:'',remaining:0,timer:null};let stats=JSON.parse(localStorage.getItem('hokenStats')||'{}');let statsReturnToQuiz=false;const SAVE_KEY='hokenProgress';const $=id=>document.getElementById(id);const saveStats=()=>localStorage.setItem('hokenStats',JSON.stringify(stats));function shuffle(a){return[...a].sort(()=>Math.random()-.5)}function showOnly(id){['home','quiz','detailPage','result','stats'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}
function saveProgress(){if(!state.list.length)return;clearInterval(state.timer);state.timer=null;localStorage.setItem(SAVE_KEY,JSON.stringify({...state,timer:null,savedAt:Date.now()}));updateResumeButton();showOnly('home');window.scrollTo({top:0,behavior:'smooth'});alert('💾 現在の問題を保存しました。ホームから続きに戻れます。');}
function loadProgress(){try{const x=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(!x||!x.list?.length)return false;clearInterval(state.timer);state={...x,timer:null};showOnly('quiz');$('timer').classList.toggle('hidden',!state.remaining);if(state.remaining)startTimer();renderQuestion();alert('▶️ 前回の続きから再開しました。');return true}catch(e){localStorage.removeItem(SAVE_KEY);updateResumeButton();return false}}
function clearProgress(){localStorage.removeItem(SAVE_KEY);updateResumeButton()}
function updateResumeButton(){const b=$('resumeBtn');if(b)b.classList.toggle('hidden',!localStorage.getItem(SAVE_KEY))}
function start(exam,mode,n){clearInterval(state.timer);let pool=questions.filter(x=>x.exam===exam);if(mode==='calc')pool=pool.filter(x=>x.calc);if(mode==='weak')pool=pool.filter(x=>(stats[x.id]?.wrong||0)>0);if(mode==='oni')pool=pool.filter(x=>x.oni===true||(x.difficulty||x.d||0)>=6||((x.difficulty||x.d||0)>=5&&((x.calc===true)||(String(x.q||'').length>=70))));if(!pool.length){alert(mode==='oni'?'鬼モードの問題がありません。難易度5以上の問題を追加してください。':'該当する問題がありません。');return}let count=Math.min(n,pool.length);state={list:shuffle(pool).slice(0,count),index:0,correct:0,answers:[],exam,practice:true,mode,remaining:mode==='oni'?15*60:0,timer:null};showOnly('quiz');$('timer').classList.toggle('hidden',mode!=='oni');if(mode==='oni')startTimer();renderQuestion()}
function startExam(exam){clearInterval(state.timer);let pool=shuffle(questions.filter(x=>x.exam===exam));let n=exam==='専門課程'?Math.min(25,pool.length):Math.min(20,pool.length);state={list:pool.slice(0,n),index:0,correct:0,answers:[],exam,practice:false,mode:'exam',remaining:exam==='専門課程'?80*60:40*60,timer:null};showOnly('quiz');$('timer').classList.remove('hidden');startTimer();renderQuestion()}
function startTimer(){updateTimer();state.timer=setInterval(()=>{state.remaining--;updateTimer();if(state.remaining<=0){clearInterval(state.timer);finish()}},1000)}function updateTimer(){let m=Math.floor(state.remaining/60),s=state.remaining%60;$('timer').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;$('timer').classList.toggle('warn',state.remaining<300)}function resetCalc(){$('calcDisplay').value='0'}
function renderQuestion(){let q=state.list[state.index];$('examBadge').textContent=(state.mode==='oni'?'👹 鬼モード / ':'')+q.exam+' / '+q.cat;$('counter').textContent=`${state.index+1} / ${state.list.length}`;$('progress').style.width=((state.index/state.list.length)*100)+'%';$('question').textContent=cleanQuestionText(q.q);$('choices').innerHTML=q.c.map((x,i)=>`<button class="choice" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${x}</button>`).join('');$('explanation').classList.add('hidden');$('detailBtn').classList.add('hidden');$('next').classList.add('hidden');$('calcWrap').classList.toggle('hidden',!q.calc);$('calculator').classList.add('hidden');$('calcToggle').textContent='🧮 電卓を表示';resetCalc();$('next').textContent='次の問題';$('quiz').classList.remove('hidden')}
function toggleCalc(){let open=$('calculator').classList.toggle('hidden');$('calcToggle').textContent=open?'🧮 電卓を表示':'🧮 電卓を非表示'}function calcInput(v){let d=$('calcDisplay');if(d.value==='0'&&v!=='.')d.value=v;else d.value+=v}function calcClear(){resetCalc()}function calcBack(){let d=$('calcDisplay');d.value=d.value.length>1?d.value.slice(0,-1):'0'}function calcEqual(){let d=$('calcDisplay');try{let expr=d.value;if(!/^[0-9+\-*/.() ]+$/.test(expr))throw 0;let result=Function('"use strict";return ('+expr+')')();if(!Number.isFinite(result))throw 0;d.value=String(Math.round(result*1e10)/1e10)}catch(e){d.value='Error'}}
function answer(selected){let q=state.list[state.index];let buttons=[...$('choices').querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);buttons[q.a].classList.add('correct');let ok=selected===q.a;if(!ok)buttons[selected].classList.add('wrong');if(ok)state.correct++;state.answers[state.index]={selected,ok};stats[q.id]??={right:0,wrong:0};stats[q.id][ok?'right':'wrong']++;stats[q.id].last=Date.now();saveStats();$('explanation').innerHTML=ok?'⭕ 正解！':'❌ 不正解';$('explanation').className='detail';$('detailBtn').classList.remove('hidden');if(state.index<state.list.length-1)$('next').classList.remove('hidden');else if(state.practice){$('next').textContent='結果を見る';$('next').classList.remove('hidden')}}
function showDetailedExplanation(){let q=state.list[state.index];$('detailNo').textContent=`${state.index+1} / ${state.list.length}`;$('detailBody').innerHTML=`<h2>${cleanQuestionText(q.q)}</h2><div class="detail"><h3>✅ 正解</h3><div class="answer">${String.fromCharCode(65+q.a)}. ${q.c[q.a]}</div><h3>🔍 詳しい解説</h3><p>${q.e||'この問題の論点を確認しましょう。'}</p>${q.p?`<h3>🧮 計算・考え方</h3><div class="formula">${q.p}</div>`:''}<h3>💡 覚えるポイント</h3><p>${q.point||'この論点は公式教材で確認しておきましょう。'}</p><h3>⚠️ ひっかけ注意</h3><p>数字・「必ず」「すべて」などの断定表現、似た用語の違いを確認してから答える。</p></div>`;showOnly('detailPage')}
function backToQuiz(){showOnly('quiz');$('quiz').scrollIntoView({behavior:'smooth',block:'start'})}function nextQuestion(){if(state.index>=state.list.length-1){finish();return}state.index++;renderQuestion();window.scrollTo({top:0,behavior:'smooth'})}function finish(){clearInterval(state.timer);$('timer').classList.add('hidden');let total=state.list.length,rate=total?Math.round(state.correct/total*100):0;localStorage.removeItem(SAVE_KEY);updateResumeButton();$('score').textContent=`${state.correct} / ${total}`;$('resultText').textContent=state.practice?`正解率 ${rate}%`:`正解率 ${rate}%｜合格ラインの目安：70%`;showOnly('result')}function backHome(){clearInterval(state.timer);statsReturnToQuiz=false;showOnly('home');updateStats();updateResumeButton()}
function updateStats(){let ids=Object.values(stats),r=ids.reduce((s,x)=>s+(x.right||0),0),w=ids.reduce((s,x)=>s+(x.wrong||0),0);$('totalCorrect').textContent=(r+w?Math.round(r/(r+w)*100):0)+'%';$('attempts').textContent=r+w}
function showStats(){statsReturnToQuiz=!$('quiz').classList.contains('hidden');let ids=Object.values(stats),r=ids.reduce((s,x)=>s+(x.right||0),0),w=ids.reduce((s,x)=>s+(x.wrong||0),0);let weak=questions.filter(q=>(stats[q.id]?.wrong||0)>0).sort((a,b)=>(stats[b.id]?.wrong||0)-(stats[a.id]?.wrong||0));$('statsBody').innerHTML=`<p>総解答数：${r+w}　正解：${r}　不正解：${w}</p><h3>苦手問題</h3>${weak.length?weak.map(q=>`<div class="review"><b>${q.cat}</b>：${cleanQuestionText(q.q)}<br>不正解 ${stats[q.id].wrong||0}回</div>`).join(''):'<p class="muted">まだありません。</p>'}`;$('statsBack').textContent=statsReturnToQuiz?'← 問題に戻る':'戻る';showOnly('stats')}
$('statsBack').onclick=function(){if(statsReturnToQuiz){showOnly('quiz');$('quiz').scrollIntoView({behavior:'smooth',block:'start'})}else backHome()};updateStats();updateResumeButton();
</script>
</body>
</html>

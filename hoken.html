x}}

<body><main class="app">
<header class="hero"><h1>📝 生命保険 試験対策</h1><p>専門課程・変額保険販売資格を、実戦レベルのオリジナル問題で攻略。</p></header>
<section id="home" class="card"><h2>🔥 実戦演習</h2><div class="notice">生命保険協会が公開する試験範囲・サンプル問題で扱われる論点を参考に、問題文・選択肢・計算問題は独自作成しています。実際の試験問題そのものは転載していません。</div>
<h3>専門課程</h3><div class="grid"><button class="btn primary" onclick="start('専門課程','random',10)">10問 練習</button><button class="btn primary" onclick="start('専門課程','random',25)">25問 練習</button><button class="btn primary" onclick="start('専門課程','calc',15)">🧮 計算15問</button><button class="btn primary" onclick="startExam('専門課程')">⏱ 本番モード</button></div>
<h3>変額保険販売資格</h3><div class="grid"><button class="btn secondary" onclick="start('変額保険販売資格','random',10)">10問 練習</button><button class="btn secondary" onclick="start('変額保険販売資格','random',25)">25問 練習</button><button class="btn secondary" onclick="start('変額保険販売資格','calc',10)">🧮 計算10問</button><button class="btn secondary" onclick="startExam('変額保険販売資格')">⏱ 本番モード</button></div>
<h3>苦手対策</h3><div class="grid"><button class="btn secondary" onclick="start('専門課程','weak',20)">専門課程 苦手</button><button class="btn secondary" onclick="start('変額保険販売資格','weak',20)">変額資格 苦手</button></div></section>
<section class="card"><div class="top"><h2>📊 学習成績</h2><button class="btn secondary" onclick="showStats()">詳細</button></div><div class="grid"><div><div class="stat" id="totalCorrect">0%</div><div class="muted">総合正解率</div></div><div><div class="stat" id="attempts">0</div><div class="muted">解答数</div></div></div></section>
<section id="quiz" class="card hidden"><div class="top"><span id="examBadge" class="badge"></span><strong id="counter"></strong><span id="timer" class="timer hidden">80:00</span></div><div class="progress"><i id="progress"></i></div><h2 id="question"></h2><div id="choices"></div><div id="explanation" class="explain hidden"></div><button id="next" class="btn primary hidden" style="width:100%;margin-top:12px" onclick="nextQuestion()">次の問題</button></section>
<section id="result" class="card hidden score"><h2>🎉 結果</h2><strong id="score"></strong><p id="resultText"></p><button class="btn primary" onclick="backHome()">ホームへ</button></section>
<section id="stats" class="card hidden"><h2>📊 成績詳細</h2><div id="statsBody"></div><button class="btn secondary" onclick="backHome()">戻る</button></section>
<div class="footer">※制度・税制・試験形式は変更される場合があります。受験時は所属会社の研修資料・生命保険協会の最新情報を優先してください。</div>

<script>
const questions=[
{id:1,exam:'専門課程',cat:'保険料',q:'予定利率を高く見込むと、他の条件が同じ場合、一般に保険料はどうなるか。',c:['高くなる','低くなる','変わらない','付加保険料だけ高くなる'],a:1,e:'予定利率が高いほど将来の運用収益を大きく見込めるため、一般に必要な保険料は低くなります。'},
{id:2,exam:'専門課程',cat:'保険料',q:'純保険料と付加保険料について正しいものはどれか。',c:['純保険料は事業費、付加保険料は保険金支払いに充てる','純保険料は保険金・給付金支払いの財源、付加保険料は事業費等の財源','両者は同じ意味である','付加保険料は予定死亡率だけで決まる'],a:1,e:'純保険料は予定死亡率・予定利率等を基礎に、保険給付の財源となる部分。付加保険料は予定事業費率等を基礎とする部分です。'},
{id:3,exam:'専門課程',cat:'生命表',q:'生命表に関する説明として正しいものはどれか。',c:['0歳の平均余命を平均寿命という','平均余命は60歳以上では計算できない','生命表は保険料を直接決定する表である','経験生命表は実際の保険契約の死亡経験とは無関係である'],a:0,e:'生命表では各年齢の平均余命を確認でき、0歳の平均余命を平均寿命と呼びます。'},
{id:4,exam:'専門課程',cat:'配当',q:'生命保険の剰余金が生じる要因として一般に挙げられるものはどれか。',c:['死差益・利差益・費差益','為替差益だけ','株価差益だけ','契約者の払込保険料だけ'],a:0,e:'剰余金は死差益・利差益・費差益など、予定と実績との差によって生じます。'},
{id:5,exam:'専門課程',cat:'商品',q:'養老保険について正しいものはどれか。',c:['満期保険金はない','死亡保険金と満期保険金が一般に同額のタイプがある','保障は必ず一生涯続く','保険期間を設定できない'],a:1,e:'養老保険は一定期間の死亡保障に加えて満期保険金を備える商品で、一般的な養老保険では死亡保険金と満期保険金が同額です。'},
{id:6,exam:'専門課程',cat:'商品',q:'保証期間付終身年金の説明として正しいものはどれか。',c:['保証期間中は生死に関係なく年金が支払われ、以後も生存していれば終身で支払われる','保証期間終了後は必ず支払いが終わる','死亡したら保証期間中でも必ず全額失効する','年金ではなく必ず一時金だけが支払われる'],a:0,e:'保証期間中は生死にかかわらず年金が支払われ、保証期間後も生存していれば終身にわたって支払われます。'},
{id:7,exam:'専門課程',cat:'保険金支払',q:'死亡保険金の免責に関する説明として適切なものはどれか。',c:['約款上の免責事由は存在しない','約款所定の免責事由に該当すると支払われないことがある','契約者の希望だけで免責事由を追加できる','自殺はどの契約でも必ず無条件に支払われる'],a:1,e:'保険契約には約款上の免責事由があり、所定の条件に該当すると保険金が支払われない場合があります。'},
{id:8,exam:'専門課程',cat:'相続',q:'被相続人に配偶者と子2人がいる場合、法定相続分として正しいものはどれか。',c:['配偶者1/2、子は各1/4','配偶者1/3、子は各1/3','配偶者1/4、子は各3/8','配偶者2/3、子は各1/6'],a:0,e:'配偶者と子が相続人の場合、配偶者が1/2、子全体で1/2。子が2人なら各1/4です。'},
{id:9,exam:'専門課程',cat:'相続',q:'相続人が配偶者と子2人、遺産が6,000万円の場合、法定相続分どおりなら配偶者の取得分はどれか。',c:['1,500万円','2,000万円','3,000万円','4,000万円'],a:2,e:'6,000万円×1/2＝3,000万円です。',calc:true},
{id:10,exam:'専門課程',cat:'相続',q:'相続人が子3人のみ、遺産が4,500万円の場合、法定相続分どおりなら各子の取得分はどれか。',c:['750万円','1,000万円','1,500万円','2,250万円'],a:2,e:'4,500万円÷3＝1,500万円です。',calc:true},
{id:11,exam:'専門課程',cat:'保険料',q:'月払保険料が18,500円の契約を12か月継続した場合、年間払込保険料はいくらか。',c:['185,000円','202,000円','222,000円','240,500円'],a:2,e:'18,500円×12＝222,000円です。',calc:true},
{id:12,exam:'専門課程',cat:'保険料',q:'月払保険料24,000円を12回払う場合と、年払276,000円を比べると、年間でいくら少ないか。',c:['8,000円','10,000円','12,000円','24,000円'],a:2,e:'24,000円×12＝288,000円。288,000−276,000＝12,000円です。',calc:true},
{id:13,exam:'専門課程',cat:'税務',q:'生命保険料控除について正しいものはどれか。',c:['払込保険料の全額が無制限に所得控除される','所得税・住民税それぞれに控除限度額がある','住民税にしか制度がない','保険金額がそのまま控除額になる'],a:1,e:'生命保険料控除には所得税・住民税それぞれの控除限度額があります。具体的な計算式は受験年度の最新教材を確認してください。'},
{id:14,exam:'専門課程',cat:'FP',q:'手取り月収30万円、生活費21万円、保険料2万円、投資3万円の場合、残る金額はいくらか。',c:['3万円','4万円','5万円','6万円'],a:1,e:'30−21−2−3＝4万円です。',calc:true},
{id:15,exam:'専門課程',cat:'企業向け保険',q:'法人が役員の死亡による事業上の資金不足に備える場合、最も重要なのはどれか。',c:['保険料が最も高い商品を選ぶ','契約目的・必要保障額・資金繰り等を確認する','税効果だけを見て決める','役員本人の意向だけで決める'],a:1,e:'法人契約では事業保障、必要保障額、資金繰り、契約目的、税務などを総合的に確認することが重要です。'},
{id:16,exam:'専門課程',cat:'募集',q:'保険募集における意向把握について最も適切なものはどれか。',c:['顧客の意向は契約後に確認すればよい','顧客の意向を把握し、それに沿った提案・説明を行う','販売者が売りたい商品を先に決める','保険料が安ければ意向確認は不要'],a:1,e:'顧客の意向を把握し、意向に沿った提案・説明を行うことは適切な募集の基本です。'},
{id:17,exam:'専門課程',cat:'契約',q:'契約者と被保険者について正しいものはどれか。',c:['契約者は契約上の権利義務を持ち、被保険者は保障の対象となる人','被保険者は必ず保険料を支払う','両者は必ず同一人物','契約者は必ず死亡保険金受取人である'],a:0,e:'契約者は契約上の権利義務を持つ人、被保険者は保険事故の対象となる人です。'},
{id:18,exam:'専門課程',cat:'社会保障',q:'公的年金についての説明として適切なものはどれか。',c:['老齢給付だけを目的とする','老齢・障害・遺族に関する給付がある','民間生命保険と同じ契約である','すべての給付額が一律である'],a:1,e:'公的年金には老齢年金だけでなく、障害年金・遺族年金があります。'},
{id:19,exam:'専門課程',cat:'医療',q:'高額療養費制度について正しいものはどれか。',c:['医療費の自己負担に一定の月額上限を設ける仕組みがある','すべての医療費が無料になる','民間保険会社が運営する','保険診療以外もすべて対象になる'],a:0,e:'高額療養費制度は、保険診療の自己負担額が一定額を超えた場合、その超過分を支給する公的医療保険制度です。'},
{id:20,exam:'専門課程',cat:'契約',q:'失効した生命保険契約の復活について一般的に適切なものはどれか。',c:['一定の条件のもとで元に戻す制度がある','どんな契約でも無条件で復活できる','保険会社の確認は不要','必ず新契約扱いになる'],a:0,e:'告知・診査や未払保険料の払込み等、約款所定の条件を満たすことで復活できる場合があります。'},
{id:21,exam:'専門課程',cat:'税務',q:'契約者・被保険者・死亡保険金受取人の関係によって、死亡保険金に関係する税の種類が変わる。正しい考え方はどれか。',c:['誰が契約者でも必ず相続税になる','契約関係によって相続税・所得税・贈与税のいずれが関係するかが変わり得る','死亡保険金は必ず非課税','税の種類は受取人と無関係'],a:1,e:'生命保険金は契約者・被保険者・受取人の関係によって課税関係が異なります。'},
{id:22,exam:'専門課程',cat:'相続',q:'法定相続人が配偶者と子1人で、遺産が8,000万円の場合、法定相続分どおりなら子の取得分はどれか。',c:['2,000万円','3,000万円','4,000万円','6,000万円'],a:2,e:'配偶者と子の場合、子の法定相続分は1/2。8,000万円×1/2＝4,000万円です。',calc:true},
{id:23,exam:'専門課程',cat:'保険金額',q:'必要保障額が3,800万円、現在加入している保障が2,400万円の場合、不足額はいくらか。',c:['1,000万円','1,200万円','1,400万円','1,600万円'],a:2,e:'3,800−2,400＝1,400万円です。',calc:true},
{id:24,exam:'専門課程',cat:'FP',q:'年間手取りが420万円、年間支出が330万円の場合、年間で残る金額はいくらか。',c:['60万円','90万円','120万円','150万円'],a:1,e:'420−330＝90万円です。',calc:true},
{id:25,exam:'専門課程',cat:'商品',q:'終身保険の一般的な特徴として正しいものはどれか。',c:['保険期間が一生涯であるタイプがある','必ず満期保険金が支払われる','保険料は必ず一括払いだけ','解約返戻金は絶対に存在しない'],a:0,e:'終身保険は一生涯の死亡保障を基本とする商品です。商品によって保険料払込期間や解約返戻金の仕組みは異なります。'},
{id:101,exam:'変額保険販売資格',cat:'特別勘定',q:'変額保険の資産運用について正しいものはどれか。',c:['特別勘定の運用実績が保険金額や解約返戻金等に影響する','特別勘定は運用損益を契約者に一切反映しない','運用成果は必ず元本を保証する','変額保険は預金保険制度の対象となる預金である'],a:0,e:'変額保険は特別勘定で運用し、その運用実績に応じて保険金額や解約返戻金等が変動する特徴があります。'},
{id:102,exam:'変額保険販売資格',cat:'リスク',q:'変額保険の販売時に説明すべき重要事項として最も適切なものはどれか。',c:['運用実績によって価額等が変動する可能性','将来の運用益を必ず保証できること','損失は必ず保険会社が補填すること','株式市場とは無関係であること'],a:0,e:'変額保険には運用リスクがあるため、価額等が変動する可能性を適切に説明する必要があります。'},
{id:103,exam:'変額保険販売資格',cat:'特別勘定',q:'特別勘定と一般勘定の説明として正しいものはどれか。',c:['特別勘定は運用実績を契約者の保険契約に反映させるために区分された勘定である','両者には何の違いもない','一般勘定は変額保険でしか使われない','特別勘定では資産運用を行わない'],a:0,e:'変額保険では、運用実績を契約者に反映させるため資産を特別勘定で管理・運用する仕組みがあります。'},
{id:104,exam:'変額保険販売資格',cat:'運用計算',q:'特別勘定の運用資産が1,000万円から900万円になった場合、単純化した運用損益はいくらか。',c:['+100万円','+10万円','-100万円','-10万円'],a:2,e:'900万円−1,000万円＝−100万円なので、100万円の減少です。',calc:true},
{id:105,exam:'変額保険販売資格',cat:'運用計算',q:'基準価額が10,000円から11,500円になった場合、上昇率はいくらか。',c:['5%','10%','15%','20%'],a:2,e:'(11,500−10,000)÷10,000×100＝15%です。',calc:true},
{id:106,exam:'変額保険販売資格',cat:'運用計算',q:'100万円を運用し、8%上昇した場合の評価額はいくらか。',c:['100万8,000円','104万円','108万円','180万円'],a:2,e:'100万円×1.08＝108万円です。',calc:true},

let state={questions:[],index:0,correct:0,answered:false,examMode:false};let stats=JSON.parse(localStorage.getItem('hokenStats')||'{}');let timerId=null;let remaining=0;
const $=id=>document.getElementById(id);function saveStats(){localStorage.setItem('hokenStats',JSON.stringify(stats))}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function start(exam,mode,count){let pool=questions.filter(q=>q.exam===exam);if(mode==='calc')pool=pool.filter(q=>q.calc);if(mode==='weak')pool=pool.filter(q=>(stats[q.id]?.attempts||0)>0&&stats[q.id].correct<stats[q.id].attempts);if(!pool.length)return alert(mode==='weak'?'苦手問題はまだありません。':'この条件の問題がありません。');state.questions=shuffle(pool).slice(0,count);state.index=0;state.correct=0;state.examMode=false;beginQuiz()}
function startExam(exam){const pool=shuffle(questions.filter(q=>q.exam===exam));state.questions=pool.slice(0,exam==='専門課程'?25:20);state.index=0;state.correct=0;state.examMode=true;remaining=exam==='専門課程'?80*60:40*60;beginQuiz();startTimer()}
function beginQuiz(){$('home').classList.add('hidden');$('stats').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');$('timer').classList.toggle('hidden',!state.examMode);showQuestion()}
function showQuestion(){const q=state.questions[state.index];state.answered=false;$('examBadge').textContent=q.exam+' / '+q.cat+(q.calc?' 🧮':'');$('counter').textContent=`${state.index+1} / ${state.questions.length}`;$('progress').style.width=((state.index)/state.questions.length*100)+'%';$('question').textContent=q.q;$('choices').innerHTML=q.c.map((x,i)=>`<button class="choice" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${x}</button>`).join('');$('explanation').classList.add('hidden');$('next').classList.add('hidden')}
function answer(i){if(state.answered)return;state.answered=true;const q=state.questions[state.index],buttons=[...document.querySelectorAll('.choice')];buttons.forEach((b,n)=>{b.disabled=true;if(n===q.a)b.classList.add('correct');if(n===i&&i!==q.a)b.classList.add('wrong')});const ok=i===q.a;if(ok)state.correct++;stats[q.id]??={attempts:0,correct:0};stats[q.id].attempts++;if(ok)stats[q.id].correct++;saveStats();$('explanation').innerHTML=`<strong>${ok?'⭕ 正解！':'❌ 不正解'}</strong><br>${q.e}`;$('explanation').classList.remove('hidden');$('next').textContent=state.index===state.questions.length-1?'結果を見る':'次の問題';$('next').classList.remove('hidden');updateStats()}
function nextQuestion(){if(state.index===state.questions.length-1){finish();return}state.index++;showQuestion()}
function finish(timeup=false){stopTimer();$('quiz').classList.add('hidden');$('result').classList.remove('hidden');const total=state.questions.length,rate=Math.round(state.correct/total*100);$('score').textContent=`${state.correct} / ${total}`;$('resultText').textContent=timeup?`時間切れ！ 正解率 ${rate}%`:`正解率 ${rate}%${state.examMode?(rate>=70?'　🎉 合格ライン到達！':'　💪 70点を目指して復習！'):''}`}
function startTimer(){stopTimer();updateTimer();timerId=setInterval(()=>{remaining--;updateTimer();if(remaining<=0)finish(true)},1000)}function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}function updateTimer(){const min=Math.floor(remaining/60),sec=remaining%60;$('timer').textContent=`${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;$('timer').classList.toggle('warn',remaining<=300)}
function backHome(){stopTimer();$('quiz').classList.add('hidden');$('result').classList.add('hidden');$('stats').classList.add('hidden');$('home').classList.remove('hidden');updateStats()}
function updateStats(){let a=0,c=0;Object.values(stats).forEach(x=>{a+=x.attempts;c+=x.correct});$('totalCorrect').textContent=a?Math.round(c/a*100)+'%':'0%';$('attempts').textContent=a}
function showStats(){$('home').classList.add('hidden');$('stats').classList.remove('hidden');$('statsBody').innerHTML=questions.map(q=>{const s=stats[q.id]||{attempts:0,correct:0};return`<div class="review"><b>${q.exam}</b>｜${q.cat}${q.calc?'｜🧮':''}<br><span class="muted">${s.attempts?`挑戦 ${s.attempts}回 / 正解 ${s.correct}回 / 正解率 ${Math.round(s.correct/s.attempts*100)}%`:'未挑戦'}</span></div>`}).join('')+`<button class="btn secondary" onclick="resetStats()" style="margin-top:12px">成績をリセット</button>`}
function resetStats(){if(confirm('成績をすべてリセットしますか？')){stats={};saveStats();showStats();updateStats()}}updateStats();
</script></body></html>

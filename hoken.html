<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1f2937"><title>生命保険 試験対策</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#1f2937;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}.app{max-width:760px;margin:auto;padding:18px 14px 50px}.hero{background:#1f2937;color:#fff;border-radius:20px;padding:24px;margin-bottom:14px}.hero h1{margin:0 0 6px;font-size:25px}.hero p{margin:0;opacity:.85}.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 3px 14px #00000012}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:12px;padding:13px;font-size:15px;font-weight:700;cursor:pointer}.primary{background:#1f2937;color:#fff}.secondary{background:#e5e7eb;color:#1f2937}.choice{display:block;width:100%;text-align:left;background:#fff;border:2px solid #e5e7eb;margin:9px 0;padding:14px;border-radius:12px;cursor:pointer;font-size:15px}.choice:hover{border-color:#9ca3af}.correct{border-color:#16a34a;background:#f0fdf4}.wrong{border-color:#dc2626;background:#fef2f2}.hidden{display:none}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.badge{display:inline-block;background:#e5e7eb;border-radius:99px;padding:5px 9px;font-size:12px}.progress{height:9px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:12px 0}.progress i{display:block;height:100%;background:#1f2937;width:0}.explain{background:#f9fafb;border-left:4px solid #1f2937;padding:12px;margin-top:12px;line-height:1.7}.stat{font-size:28px;font-weight:800}.muted{color:#6b7280;font-size:13px}.list button{margin:5px 5px 0 0}.score{text-align:center}.score strong{font-size:48px}.review{padding:12px 0;border-bottom:1px solid #e5e7eb}.danger{color:#b91c1c}.footer{font-size:12px;color:#6b7280;text-align:center;margin-top:20px}@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style></head>
<body><main class="app">
<header class="hero"><h1>📝 生命保険 試験対策</h1><p>専門課程・変額保険販売資格をオリジナル問題で学習</p></header>
<section id="home" class="card"><h2>今日の学習</h2><div class="grid"><button class="btn primary" onclick="start('専門課程','random')">専門課程 10問</button><button class="btn primary" onclick="start('変額保険販売資格','random')">変額資格 10問</button><button class="btn secondary" onclick="start('専門課程','weak')">専門課程 苦手</button><button class="btn secondary" onclick="start('変額保険販売資格','weak')">変額資格 苦手</button></div></section>
<section class="card"><div class="top"><h2>📊 学習成績</h2><button class="btn secondary" onclick="showStats()">詳細</button></div><div class="grid"><div><div class="stat" id="totalCorrect">0%</div><div class="muted">総合正解率</div></div><div><div class="stat" id="streak">0</div><div class="muted">最高連続正解</div></div></div></section>
<section id="quiz" class="card hidden"><div class="top"><span id="examBadge" class="badge"></span><strong id="counter"></strong></div><div class="progress"><i id="progress"></i></div><h2 id="question"></h2><div id="choices"></div><div id="explanation" class="explain hidden"></div><button id="next" class="btn primary hidden" style="width:100%;margin-top:12px" onclick="nextQuestion()">次の問題</button></section>
<section id="result" class="card hidden score"><h2>🎉 結果</h2><strong id="score"></strong><p id="resultText"></p><button class="btn primary" onclick="backHome()">ホームへ</button></section>
<section id="stats" class="card hidden"><h2>📊 成績詳細</h2><div id="statsBody"></div><button class="btn secondary" onclick="backHome()">戻る</button></section>
<div class="footer">※学習用のオリジナル問題です。実際の試験問題そのものではありません。</div>
</main>
<script>
const questions=[
{id:1,exam:'専門課程',cat:'生命保険の基礎',q:'生命保険契約において、保険事故が発生した場合に保険金を受け取る人を何というか。',c:['契約者','被保険者','保険金受取人','保険者'],a:2,e:'保険金受取人は、保険事故が発生したときに保険金を受け取る人です。'},
{id:2,exam:'専門課程',cat:'生命保険の基礎',q:'終身保険の特徴として最も適切なものはどれか。',c:['保険期間が一定期間だけである','保障が一生涯続く','満期時に必ず満期保険金を受け取る','保険料は必ず毎年変動する'],a:1,e:'終身保険は、原則として保障が一生涯続く死亡保険です。'},
{id:3,exam:'専門課程',cat:'税・相続',q:'法定相続人について、配偶者はどのような位置づけか。',c:['常に法定相続人ではない','他の相続人がいる場合だけ相続人になる','常に法定相続人となる','遺言がある場合だけ相続人になる'],a:2,e:'配偶者は常に法定相続人となり、子などの血族相続人とともに相続します。'},
{id:4,exam:'専門課程',cat:'社会保障',q:'公的年金制度について、老齢基礎年金を支給する主体はどれか。',c:['日本年金機構','生命保険会社','市区町村のみ','金融庁'],a:0,e:'公的年金の実務では日本年金機構が年金の適用・保険料徴収・給付などを担っています。'},
{id:5,exam:'専門課程',cat:'コンプライアンス',q:'生命保険募集人が顧客に商品を説明する際に重要な姿勢はどれか。',c:['不利益な事項は説明しない','顧客の意向や理解を確認する','契約を急がせる','比較説明を避ける'],a:1,e:'顧客の意向を把握し、重要事項や不利益事項を適切に説明して理解を確認することが重要です。'},
{id:6,exam:'専門課程',cat:'商品',q:'定期保険の一般的な特徴はどれか。',c:['一定期間を保障する','必ず一生涯保障する','必ず解約返戻金が大きい','保険期間を設定できない'],a:0,e:'定期保険は一定の保険期間を定め、その期間中の死亡などを保障する保険です。'},
{id:7,exam:'専門課程',cat:'税・相続',q:'生命保険料控除の対象となる保険契約について、一般的に重要な確認事項はどれか。',c:['契約内容や保険料の区分','被保険者の血液型','営業担当者の所属','保険会社の本店所在地だけ'],a:0,e:'生命保険料控除では契約内容や保険料の区分などを確認する必要があります。'},
{id:8,exam:'専門課程',cat:'企業向け保険',q:'企業向け生命保険を活用する際に重要なのはどれか。',c:['企業の保障ニーズを確認する','個人の趣味だけで商品を選ぶ','税務を一切確認しない','契約目的を確認しない'],a:0,e:'企業向け保険では、経営者・従業員の保障、事業保障など企業のニーズを把握することが基本です。'},
{id:9,exam:'専門課程',cat:'FP・コンサルティング',q:'保険提案で最初に行うこととして適切なのはどれか。',c:['最も高額な商品を勧める','顧客の意向やライフプランを把握する','契約書に署名してもらう','保険料だけを比較する'],a:1,e:'適切な提案には、顧客の意向、家族構成、収支、将来計画などの把握が重要です。'},
{id:10,exam:'専門課程',cat:'生命保険の基礎',q:'契約者と被保険者の違いとして正しいものはどれか。',c:['契約者は保険会社、被保険者は代理店','契約者は契約上の権利義務を持ち、被保険者は保障の対象となる人','両者は必ず同一人物','被保険者は必ず保険金受取人'],a:1,e:'契約者は保険契約を締結し契約上の権利義務を持つ人、被保険者は保険事故の対象となる人です。'},
{id:101,exam:'変額保険販売資格',cat:'変額保険',q:'変額保険の保険金額や解約返戻金等の特徴として適切なのはどれか。',c:['運用実績の影響を受ける','常に一定である','銀行預金と同じである','必ず元本が保証される'],a:0,e:'変額保険は特別勘定の運用実績に応じて、保険金額や解約返戻金等が変動します。'},
{id:102,exam:'変額保険販売資格',cat:'変額保険',q:'変額保険の販売で特に重要な説明はどれか。',c:['運用リスク等の重要事項','担当者の趣味','会社の社員数','店舗の営業時間だけ'],a:0,e:'変額保険では運用実績による変動など、顧客が負担するリスクや重要事項を適切に説明することが重要です。'},
{id:103,exam:'変額保険販売資格',cat:'特別勘定',q:'変額保険の資産運用に関係する勘定は一般に何と呼ばれるか。',c:['普通勘定のみ','特別勘定','給与勘定','決済勘定'],a:1,e:'変額保険では、運用実績を契約者に反映させるため特別勘定が用いられます。'},
{id:104,exam:'変額保険販売資格',cat:'リスク',q:'変額保険の運用実績が悪化した場合に考えられることはどれか。',c:['解約返戻金等が減少する可能性がある','必ず増加する','変動しない','銀行が補てんする'],a:0,e:'運用実績が悪化すると、解約返戻金等が減少する可能性があります。'},
{id:105,exam:'変額保険販売資格',cat:'コンプライアンス',q:'変額保険の募集において適切なのはどれか。',c:['リスクを説明しない','顧客の意向を確認し適切に説明する','利益を保証する','損失が出ないと断定する'],a:1,e:'変額保険は運用リスクを伴うため、顧客の意向確認とリスクを含む適切な説明が重要です。'},
{id:106,exam:'変額保険販売資格',cat:'販売資格',q:'変額保険販売資格試験の位置づけとして正しいものはどれか。',c:['変額保険販売に必要な知識を確認する','一般課程の代わりになる','税理士資格である','誰でも自由に販売できる資格である'],a:0,e:'生命保険協会は変額保険の販売に必要な知識を修得するための資格試験として位置づけています。'},
{id:107,exam:'変額保険販売資格',cat:'商品',q:'変額保険と定額保険の違いとして適切なのはどれか。',c:['変額保険は運用実績が保険金額等に影響する','定額保険は必ず株式で運用する','変額保険は絶対に価格変動しない','両者に違いはない'],a:0,e:'変額保険は運用実績が契約内容に影響する点が重要な特徴です。'},
{id:108,exam:'変額保険販売資格',cat:'顧客保護',q:'顧客に変額保険を提案する際、適切な対応はどれか。',c:['顧客の資産状況や意向等を踏まえる','全員に同じ商品を勧める','短時間で契約を迫る','損失可能性を隠す'],a:0,e:'顧客の意向や資産状況等を踏まえ、商品特性やリスクを適切に説明することが重要です。'},
{id:109,exam:'変額保険',cat:'運用',q:'特別勘定の運用実績について正しいものはどれか。',c:['将来の運用成果を確実に保証できる','市場環境等により変動する','必ず毎年プラスになる','契約者には関係しない'],a:1,e:'特別勘定の運用実績は市場環境等の影響を受け、将来の成果が保証されるものではありません。'},
{id:110,exam:'変額保険販売資格',cat:'販売',q:'変額保険の販売資格者について正しいものはどれか。',c:['必要な資格・登録等を満たした者が販売する','資格は不要','誰でも販売できる','契約者が資格を持てばよい'],a:0,e:'変額保険の販売には、生命保険協会の制度上の要件を満たすことが必要です。'}
];
let state={questions:[],index:0,correct:0,answered:false,mode:'random'};let stats=JSON.parse(localStorage.getItem('hokenStats')||'{}');
const $=id=>document.getElementById(id);function saveStats(){localStorage.setItem('hokenStats',JSON.stringify(stats))}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function start(exam,mode){let pool=questions.filter(q=>q.exam===exam);if(mode==='weak')pool=pool.filter(q=>(stats[q.id]?.attempts||0)>0&&stats[q.id].correct<stats[q.id].attempts);if(!pool.length)return alert('苦手問題はまだありません。まず通常問題に挑戦しましょう！');state.questions=shuffle(pool).slice(0,10);state.index=0;state.correct=0;state.mode=mode;$('home').classList.add('hidden');$('stats').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');showQuestion()}
function showQuestion(){const q=state.questions[state.index];state.answered=false;$('examBadge').textContent=q.exam+' / '+q.cat;$('counter').textContent=`${state.index+1} / ${state.questions.length}`;$('progress').style.width=((state.index)/state.questions.length*100)+'%';$('question').textContent=q.q;$('choices').innerHTML=q.c.map((x,i)=>`<button class="choice" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${x}</button>`).join('');$('explanation').classList.add('hidden');$('next').classList.add('hidden')}
function answer(i){if(state.answered)return;state.answered=true;const q=state.questions[state.index],buttons=[...document.querySelectorAll('.choice')];buttons.forEach((b,n)=>{b.disabled=true;if(n===q.a)b.classList.add('correct');if(n===i&&i!==q.a)b.classList.add('wrong')});const ok=i===q.a;if(ok)state.correct++;stats[q.id]??={attempts:0,correct:0};stats[q.id].attempts++;if(ok)stats[q.id].correct++;saveStats();$('explanation').innerHTML=`<strong>${ok?'⭕ 正解！':'❌ 不正解'}</strong><br>${q.e}`;$('explanation').classList.remove('hidden');$('next').textContent=state.index===state.questions.length-1?'結果を見る':'次の問題';$('next').classList.remove('hidden');updateStats()}
function nextQuestion(){if(state.index===state.questions.length-1){finish();return}state.index++;showQuestion()}
function finish(){$('quiz').classList.add('hidden');$('result').classList.remove('hidden');const total=state.questions.length,rate=Math.round(state.correct/total*100);$('score').textContent=`${state.correct} / ${total}`;$('resultText').textContent=`正解率 ${rate}%！${rate>=70?'合格ラインを意識できる結果やで👍':'もう一周して苦手をつぶそう💪'}`}
function backHome(){$('quiz').classList.add('hidden');$('result').classList.add('hidden');$('stats').classList.add('hidden');$('home').classList.remove('hidden');updateStats()}
function updateStats(){let a=Object.values(stats).reduce((s,x)=>s+x.attempts,0),c=Object.values(stats).reduce((s,x)=>s+x.correct,0);$('totalCorrect').textContent=a?Math.round(c/a*100)+'%':'0%';let best=0,cur=0;questions.forEach(q=>{if(stats[q.id]?.attempts){if(stats[q.id].correct===stats[q.id].attempts)cur++;else cur=0;best=Math.max(best,cur)}});$('streak').textContent=best}
function showStats(){$('home').classList.add('hidden');$('stats').classList.remove('hidden');let rows=questions.map(q=>{let s=stats[q.id]||{attempts:0,correct:0};return`<div class="review"><b>${q.exam}</b>｜${q.cat}<br><span class="muted">${s.attempts?`挑戦 ${s.attempts}回 / 正解 ${s.correct}回 / 正解率 ${Math.round(s.correct/s.attempts*100)}%`:'未挑戦'}</span></div>`}).join('');$('statsBody').innerHTML=rows+`<button class="btn secondary" onclick="resetStats()" style="margin-top:12px">成績をリセット</button>`}
function resetStats(){if(confirm('成績をすべてリセットしますか？')){stats={};saveStats();showStats();updateStats()}}
updateStats();
</script></body></html>

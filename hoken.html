0 8px}.detail .answer{font-weight:800}.formula{background:#fff;border:1px solid #dfe3e8;border-radius:10px;padding:12px;font-family:ui-monospace,monospace;white-space:pre-wrap}.calcWrap{margin-top:16px}.calcBox{max-width:330px;margin:10px auto 0;background:#20242c;border-radius:18px;padding:14px;box-shadow:0 5px 18px #0002}.calcDisplay{width:100%;height:56px;border:0;border-radius:10px;background:#fff;text-align:right;padding:8px 12px;font-size:26px;font-family:ui-monospace,monospace;margin-bottom:10px}.calcKeys{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.calcKeys button{height:52px;border:0;border-radius:10px;font-size:19px;font-weight:700;cursor:pointer;background:#f1f3f6;color:#172033}.calcKeys button.op{background:#dfe5ef}.calcKeys button.eq{background:#172033;color:#fff}.calcKeys button.clear{grid-column:span 2}.footer{font-size:12px;color:#667085;text-align:center;margin-top:20px;line-height:1.6}@media(max-width:560px){.grid{grid-template-columns:1fr}.hero h1{font-size:21px}}</style></head><body><main class="app"><header class="hero"><h1>📝 生命保険 試験対策</h1><p>専門課程・変額保険販売資格を、実戦レベルのオリジナル問題で攻略。</p></header><section id="home" class="card"><h2>🔥 実戦演習</h2><div class="notice">公開されている試験範囲・サンプル等の論点を参考に、問題文・選択肢・計算問題は独自作成しています。実際の試験問題そのものは転載していません。</div><h3>専門課程</h3><div class="grid"><button class="btn primary" onclick="start('専門課程','random',10)">10問 練習</button><button class="btn primary" onclick="start('専門課程','random',25)">25問 練習</button><button class="btn primary" onclick="start('専門課程','calc',15)">🧮 計算問題</button><button class="btn primary" onclick="startExam('専門課程')">⏱ 本番モード</button></div><h3>変額保険販売資格</h3><div class="grid"><button class="btn secondary" onclick="start('変額保険販売資格','random',10)">10問 練習</button><button class="btn secondary" onclick="start('変額保険販売資格','random',25)">25問 練習</button><button class="btn secondary" onclick="start('変額保険販売資格','calc',10)">🧮 計算問題</button><button class="btn secondary" onclick="startExam('変額保険販売資格')">⏱ 本番モード</button></div><h3>苦手対策</h3><div class="grid"><button class="btn secondary" onclick="start('専門課程','weak',20)">専門課程 苦手</button><button class="btn secondary" onclick="start('変額保険販売資格','weak',20)">変額資格 苦手</button></div></section><section class="card"><div class="top"><h2>📊 学習成績</h2><button class="btn secondary" onclick="showStats()">詳細</button></div><div class="grid"><div><div class="stat" id="totalCorrect">0%</div><div class="muted">総合正解率</div></div><div><div class="stat" id="attempts">0</div><div class="muted">解答数</div></div></div></section><section id="quiz" class="card hidden"><div class="top"><span id="examBadge" class="badge"></span><strong id="counter"></strong><span id="timer" class="timer hidden">80:00</span></div><div class="progress"><i id="progress"></i></div><h2 id="question"></h2><div id="choices"></div><div id="calcWrap" class="calcWrap hidden"><button class="btn secondary" style="width:100%" onclick="toggleCalc()">🧮 電卓を表示 / 非表示</button><div id="calculator" class="calcBox hidden"><input id="calcDisplay" class="calcDisplay" value="0" readonly><div class="calcKeys"><button class="clear" onclick="calcClear()">AC</button><button onclick="calcBack()">←</button><button class="op" onclick="calcInput('/')">÷</button><button onclick="calcInput('7')">7</button><button onclick="calcInput('8')">8</button><button onclick="calcInput('9')">9</button><button class="op" onclick="calcInput('*')">×</button><button onclick="calcInput('4')">4</button><button onclick="calcInput('5')">5</button><button onclick="calcInput('6')">6</button><button class="op" onclick="calcInput('-')">−</button><button onclick="calcInput('1')">1</button><button onclick="calcInput('2')">2</button><button onclick="calcInput('3')">3</button><button class="op" onclick="calcInput('+')">＋</button><button onclick="calcInput('0')">0</button><button onclick="calcInput('.')">.</button><button class="eq" onclick="calcEqual()">=</button></div></div></div><div id="explanation" class="hidden"></div><button id="detailBtn" class="btn secondary hidden" style="width:100%;margin-top:12px" onclick="showDetailedExplanation()">📖 詳しい解説を見る</button><button id="next" class="btn primary hidden" style="width:100%;margin-top:12px" onclick="nextQuestion()">次の問題</button></section><section id="detailPage" class="card hidden"><div class="top"><span class="badge">📖 詳細解説</span><span id="detailNo"></span></div><div id="detailBody"></div><div class="grid" style="margin-top:14px"><button class="btn secondary" onclick="backToQuiz()">← 問題に戻る</button><button class="btn primary" onclick="nextQuestion()">次の問題 →</button></div></section><section id="result" class="card hidden score"><h2>🎉 結果</h2><strong id="score"></strong><p id="resultText"></p><button class="btn primary" onclick="backHome()">ホームへ</button></section><section id="stats" class="card hidden"><h2>📊 成績詳細</h2><div id="statsBody"></div><button class="btn secondary" onclick="backHome()">戻る</button></section><div class="footer">※制度・税制・試験形式は変更される場合があります。受験時は所属会社の研修資料・生命保険協会の最新情報を優先してください。</div></main><script>
const questions=[
{id:1,exam:'専門課程',cat:'保険料',q:'予定利率を高く見込むと、他の条件が同じ場合、一般に保険料はどうなるか。',c:['高くなる','低くなる','変わらない','付加保険料だけ高くなる'],a:1,e:'予定利率が高いほど将来の運用収益を大きく見込めるため、一般に必要な保険料は低くなります。',p:'予定利率↑ → 見込運用収益↑ → 必要な保険料↓',point:'予定利率が高いほど、他の条件が同じなら保険料は低くなる。'},
{id:2,exam:'専門課程',cat:'保険料',q:'純保険料と付加保険料について正しいものはどれか。',c:['純保険料は事業費、付加保険料は保険金支払いに充てる','純保険料は保険金・給付金支払いの財源、付加保険料は事業費等の財源','両者は同じ意味である','付加保険料は予定死亡率だけで決まる'],a:1,e:'純保険料は保険給付の財源となる部分、付加保険料は事業費等の財源となる部分です。',point:'純＝保障、付加＝事業費と整理する。'},
{id:3,exam:'専門課程',cat:'生命表',q:'生命表に関する説明として正しいものはどれか。',c:['0歳の平均余命を平均寿命という','平均余命は60歳以上では計算できない','生命表は保険料を直接決定する表である','経験生命表は実際の保険契約の死亡経験とは無関係である'],a:0,e:'生命表では各年齢の平均余命を確認でき、0歳の平均余命を平均寿命と呼びます。',point:'平均寿命＝0歳の平均余命。'},
{id:4,exam:'専門課程',cat:'配当',q:'生命保険の剰余金が生じる要因として一般に挙げられるものはどれか。',c:['死差益・利差益・費差益','為替差益だけ','株価差益だけ','契約者の払込保険料だけ'],a:0,e:'剰余金は死差益・利差益・費差益など、予定と実績との差によって生じます。',point:'死差＝死亡率、利差＝運用、費差＝事業費。'},
{id:5,exam:'専門課程',cat:'商品',q:'養老保険について正しいものはどれか。',c:['満期保険金はない','死亡保険金と満期保険金が一般に同額のタイプがある','保障は必ず一生涯続く','保険期間を設定できない'],a:1,e:'養老保険は一定期間の死亡保障と満期保険金を備える商品です。',point:'一定期間の死亡保障＋満期保険金。'},
{id:6,exam:'専門課程',cat:'相続',q:'被相続人に配偶者と子2人がいる場合、法定相続分として正しいものはどれか。',c:['配偶者1/2、子は各1/4','配偶者1/3、子は各1/3','配偶者1/4、子は各3/8','配偶者2/3、子は各1/6'],a:0,e:'配偶者と子が相続人の場合、配偶者が1/2、子全体で1/2。子が2人なら各1/4です。',p:'配偶者：6,000万円 × 1/2 ＝ 3,000万円',point:'配偶者＋子なら配偶者1/2、子全体1/2。',calc:true},
{id:7,exam:'専門課程',cat:'相続',q:'相続人が子3人のみ、遺産が4,500万円の場合、法定相続分どおりなら各子の取得分はどれか。',c:['750万円','1,000万円','1,500万円','2,250万円'],a:2,e:'子3人が相続人の場合、各人の法定相続分は1/3です。4,500万円÷3＝1,500万円。',p:'4,500万円 ÷ 3 ＝ 1,500万円',point:'子だけが相続人の場合、原則として均等に分ける。',calc:true},
{id:8,exam:'専門課程',cat:'保険料',q:'月払保険料が18,500円の契約を12か月継続した場合、年間払込保険料はいくらか。',c:['185,000円','202,000円','222,000円','240,500円'],a:2,e:'18,500円×12＝222,000円です。',p:'18,500 × 12 ＝ 222,000円',point:'月払→年間は12か月を掛ける。',calc:true},
{id:9,exam:'専門課程',cat:'保険料',q:'月払保険料24,000円を12回払う場合と、年払276,000円を比べると、年間でいくら少ないか。',c:['8,000円','10,000円','12,000円','24,000円'],a:2,e:'月払は24,000円×12＝288,000円。288,000−276,000＝12,000円です。',p:'24,000×12＝288,000円 → 288,000−276,000＝12,000円',point:'比較するときは両方を年間金額にそろえる。',calc:true},
{id:10,exam:'専門課程',cat:'必要保障',q:'死亡時の必要資金が5,200万円、準備済み資金が3,650万円の場合、不足する保障額はいくらか。',c:['1,350万円','1,550万円','1,750万円','2,550万円'],a:1,e:'5,200万円−3,650万円＝1,550万円です。',p:'5,200万円 − 3,650万円 ＝ 1,550万円',point:'必要資金から準備済み資金を差し引く。',calc:true},
{id:11,exam:'変額保険販売資格',cat:'運用計算',q:'特別勘定の資産100万円が20％上昇した後、10％下落した。最終的な評価額はいくらか。',c:['90万円','98万円','100万円','108万円'],a:3,e:'100万円×1.20＝120万円。その後120万円×0.90＝108万円です。',p:'100万円 × 1.20 ＝ 120万円 → 120万円 × 0.90 ＝ 108万円',point:'上昇率と下落率は単純に足し引きせず、順番に掛ける。',calc:true},
{id:12,exam:'変額保険販売資格',cat:'運用計算',q:'1口あたり基準価額が12,500円で、800口を保有している場合の評価額はいくらか。',c:['100万円','1,000万円','10億円','10万円'],a:1,e:'12,500円×800口＝10,000,000円、つまり1,000万円です。',p:'12,500 × 800 ＝ 10,000,000円',point:'口数の桁を必ず確認する。',calc:true},
{id:13,exam:'変額保険販売資格',cat:'運用計算',q:'100万円を運用し、1年目に10％上昇、2年目に10％上昇した場合の評価額はいくらか。',c:['120万円','121万円','110万円','100万円'],a:1,e:'100万円×1.10×1.10＝121万円です。',p:'100万円 × 1.10 × 1.10 ＝ 121万円',point:'10％＋10％＝20％と単純加算せず、各年の倍率を順番に掛ける。',calc:true},
{id:14,exam:'変額保険販売資格',cat:'運用リスク',q:'変額保険について最も適切なものはどれか。',c:['運用実績にかかわらず解約返戻金は常に払込保険料を上回る','特別勘定の運用実績によって解約返戻金等が変動する','運用リスクは保険会社だけが負う','特別勘定の資産は一般勘定と区分されない'],a:1,e:'変額保険では特別勘定の運用実績が解約返戻金等に反映され、契約者が運用リスクを負う部分があります。',point:'変額保険は運用実績により資産価値が変動する。'}
];
let state={list:[],index:0,correct:0,exam:'',practice:false,remaining:0,timer:null};let stats=JSON.parse(localStorage.getItem('hokenStats')||'{}');const $=id=>document.getElementById(id);function saveStats(){localStorage.setItem('hokenStats',JSON.stringify(stats))}function shuffle(a){return[...a].sort(()=>Math.random()-.5)}
function start(exam,mode,n){clearInterval(state.timer);let pool=questions.filter(x=>x.exam===exam);if(mode==='calc')pool=pool.filter(x=>x.calc);if(mode==='weak')pool=pool.filter(x=>(stats[x.id]?.wrong||0)>0);if(!pool.length){alert('該当する問題がありません。まず通常演習を解いてください。');return}state={list:shuffle(pool).slice(0,n),index:0,correct:0,exam,practice:true,remaining:0,timer:null};showOnly('quiz');renderQuestion()}
function startExam(exam){clearInterval(state.timer);let pool=shuffle(questions.filter(x=>x.exam===exam));let n=Math.min(exam==='専門課程'?25:20,pool.length);state={list:pool.slice(0,n),index:0,correct:0,exam,practice:false,remaining:exam==='専門課程'?4800:2400,timer:null};showOnly('quiz');$('timer').classList.remove('hidden');startTimer();renderQuestion()}
function startTimer(){updateTimer();state.timer=setInterval(()=>{state.remaining--;updateTimer();if(state.remaining<=0){clearInterval(state.timer);finish()}},1000)}function updateTimer(){let m=Math.floor(state.remaining/60),s=state.remaining%60;$('timer').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;$('timer').classList.toggle('warn',state.remaining<300)}
function renderQuestion(){let q=state.list[state.index];$('examBadge').textContent=q.exam+' / '+q.cat;$('counter').textContent=`${state.index+1} / ${state.list.length}`;$('progress').style.width=((state.index/state.list.length)*100)+'%';$('question').textContent=q.q;$('choices').innerHTML=q.c.map((x,i)=>`<button class="choice" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${x}</button>`).join('');$('explanation').classList.add('hidden');$('detailBtn').classList.add('hidden');$('next').classList.add('hidden');$('calcWrap').classList.toggle('hidden',!q.calc);$('calculator').classList.add('hidden');calcClear()}
function answer(selected){let q=state.list[state.index],buttons=[...$('choices').querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);buttons[q.a].classList.add('correct');let ok=selected===q.a;if(!ok)buttons[selected].classList.add('wrong');if(ok)state.correct++;stats[q.id]??={right:0,wrong:0};stats[q.id][ok?'right':'wrong']++;saveStats();$('explanation').innerHTML=ok?'⭕ 正解！':'❌ 不正解';$('explanation').className='detail';$('detailBtn').classList.remove('hidden');if(state.index<state.list.length-1)$('next').classList.remove('hidden');else{$('next').textContent='結果を見る';$('next').classList.remove('hidden')}}
function showDetailedExplanation(){let q=state.list[state.index];$('detailNo').textContent=`${state.index+1} / ${state.list.length}`;$('detailBody').innerHTML=`<h2>${q.q}</h2><div class="detail"><h3>✅ 正解</h3><div class="answer">${String.fromCharCode(65+q.a)}. ${q.c[q.a]}</div><h3>🔍 詳しい解説</h3><p>${q.e}</p>${q.p?`<h3>🧮 計算・考え方</h3><div class="formula">${q.p}</div>`:''}<h3>💡 覚えるポイント</h3><p>${q.point}</p><h3>⚠️ ひっかけ注意</h3><p>数字・単位・割合、「必ず」「すべて」などの断定表現、似た用語の違いを確認する。</p></div>`;showOnly('detailPage')}
function backToQuiz(){showOnly('quiz')}function nextQuestion(){if(state.index>=state.list.length-1){finish();return}state.index++;renderQuestion()}function finish(){clearInterval(state.timer);$('timer').classList.add('hidden');let rate=Math.round(state.correct/state.list.length*100);$('score').textContent=`${state.correct} / ${state.list.length}`;$('resultText').textContent=`正解率 ${rate}%${state.practice?'':'｜合格ラインの目安：70%'}`;showOnly('result')}
function showOnly(id){['home','quiz','detailPage','result','stats'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}function backHome(){clearInterval(state.timer);showOnly('home');updateStats()}function updateStats(){let a=Object.values(stats),r=a.reduce((s,x)=>s+(x.right||0),0),w=a.reduce((s,x)=>s+(x.wrong||0),0);$('totalCorrect').textContent=(r+w?Math.round(r/(r+w)*100):0)+'%';$('attempts').textContent=r+w}
function showStats(){let a=Object.values(stats),r=a.reduce((s,x)=>s+(x.right||0),0),w=a.reduce((s,x)=>s+(x.wrong||0),0),weak=questions.filter(q=>(stats[q.id]?.wrong||0)>0).sort((x,y)=>(stats[y.id]?.wrong||0)-(stats[x.id]?.wrong||0));$('statsBody').innerHTML=`<p>総解答数：${r+w}　正解：${r}　不正解：${w}</p><h3>苦手問題</h3>${weak.length?weak.map(q=>`<div class="review"><b>${q.cat}</b>：${q.q}<br>不正解 ${stats[q.id].wrong||0}回</div>`).join(''):'<p class="muted">まだありません。</p>'}`;showOnly('stats')}
let calcExpr='0';function calcInput(v){if(calcExpr==='0'&&/[0-9.]/.test(v))calcExpr=v;else calcExpr+=v;$('calcDisplay').value=calcExpr}function calcClear(){calcExpr='0';$('calcDisplay').value='0'}function calcBack(){calcExpr=calcExpr.length>1?calcExpr.slice(0,-1):'0';$('calcDisplay').value=calcExpr}function calcEqual(){try{if(!/^[0-9+\-*/.() ]+$/.test(calcExpr))throw 0;let value=Function('return '+calcExpr)();if(!Number.isFinite(value))throw 0;calcExpr=String(Math.round(value*100000000)/100000000);$('calcDisplay').value=calcExpr}catch(e){$('calcDisplay').value='エラー';setTimeout(calcClear,800)}}function toggleCalc(){$('calculator').classList.toggle('hidden')}updateStats();</script></body></html>

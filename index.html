<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IT STUDY</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#eef4ff,#f7f8fc);color:#172033;font-family:system-ui,'Noto Sans JP',sans-serif}.wrap{max-width:850px;margin:auto;padding:28px 16px}.logo{text-align:center;color:#4f6df5;font-weight:800;letter-spacing:3px}.title{text-align:center}.card{background:white;border:1px solid #e6e9f0;border-radius:20px;padding:20px;box-shadow:0 8px 25px #1e2d5012}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{text-align:center;background:#f6f8fc;border-radius:14px;padding:14px}.n{font-size:24px;font-weight:800}.subjects{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.subject,.choice,button{border:1px solid #e2e6ee;background:white;border-radius:14px;padding:15px;cursor:pointer;font-size:15px}.subject{text-align:left}.subject b{display:block;margin-top:7px}.subject small{color:#7a8392}.start,.next{width:100%;margin-top:18px;border:0;background:#4f6df5;color:white;font-weight:800}.hidden{display:none}.top{display:flex;justify-content:space-between;align-items:center}.q{font-size:20px;font-weight:800;line-height:1.6;margin:20px 0}.choices{display:grid;gap:10px}.choice{text-align:left}.choice.ok{background:#edf9f3;border:2px solid #35a66f}.choice.ng{background:#fff0f1;border:2px solid #e05b62}.result{margin-top:15px;background:#f6f8fc;border-radius:14px;padding:15px;line-height:1.7}.score{text-align:center;font-size:45px;font-weight:900;margin:15px}.center{text-align:center}.back{background:#f0f2f7}.soon{text-align:center;color:#667085}@media(max-width:520px){.wrap{padding:20px 12px}.subjects{gap:8px}.q{font-size:18px}}</style></head><body><div class="wrap"><div id="home"><div class="logo">IT STUDY</div><h1 class="title">ともやの学習アプリ</h1><p class="title">毎日の勉強を、ちょっと楽しく。</p><section class="card"><h3>📚 今日の学習状況</h3><div class="stats"><div class="stat"><div class="n" id="tq">0</div><small>問題数</small></div><div class="stat"><div class="n" id="cr">--%</div><small>正解率</small></div><div class="stat"><div class="n" id="st">0</div><small>連続正解</small></div></div></section><h3>📖 学習メニュー</h3><div class="subjects"><button class="subject" onclick="start()">🌐<b>ネットワーク</b><small>CCNA・TCP/IP・VLAN</small></button><button class="subject" onclick="soon('応用情報')">💻<b>応用情報</b><small>午前・午後対策</small></button><button class="subject" onclick="soon('Linux')">🐧<b>Linux</b><small>コマンド・操作</small></button><button class="subject" onclick="soon('SQL')">💾<b>SQL</b><small>SELECT・JOIN・DB</small></button></div><button class="start" onclick="start()">🚀 ネットワーク学習を始める</button><p class="soon" id="msg">🌐 ネットワーク問題 100問 ／ 毎回10問ランダム</p></div><div id="quiz" class="hidden"><div class="logo">NETWORK TRAINING</div><h1 class="title">🌐 ネットワーク演習</h1><section class="card"><div class="top"><button class="back" onclick="home()">← 戻る</button><b id="prog"></b></div><div class="q" id="q"></div><div class="choices" id="cs"></div><div id="res"></div></section></div><div id="finish" class="hidden"><div class="logo">RESULT</div><h1 class="title">🎉 演習終了！</h1><section class="card center"><div>今回の正解率</div><div class="score" id="fs"></div><p id="ft"></p><button class="start" onclick="start()">もう一度挑戦</button><button class="back" onclick="home()">トップへ戻る</button></section></div></div><script>const F=[

const bank=F.flatMap((x,i)=>[mk(x,0,i),mk(x,1,i)]);function mk(x,v,i){let o=[x[2],...x[3]];o=o.sort(()=>Math.sin(i*91+v*17+o.join('').length)-.5);return{cat:x[0],q:x[1],c:o,a:o.indexOf(x[2]),e:x[2]+' が正解。'+x[1].replace('？','。')}}let qs=[],cur=0,score=0,ans=false;function start(){qs=[...bank].sort(()=>Math.random()-.5).slice(0,10);cur=score=0;document.getElementById('home').classList.add('hidden');document.getElementById('finish').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');show()}function show(){ans=false;let x=qs[cur];document.getElementById('prog').textContent=`第${cur+1}問 / 10問`;document.getElementById('q').textContent=x.q;document.getElementById('res').innerHTML='';let c=document.getElementById('cs');c.innerHTML='';x.c.forEach((v,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=String.fromCharCode(65+i)+'. '+v;b.onclick=()=>answer(i);c.appendChild(b)})}function answer(i){if(ans)return;ans=true;let x=qs[cur],bs=document.querySelectorAll('.choice');bs.forEach((b,j)=>{b.disabled=true;if(j===x.a)b.classList.add('ok');if(j===i&&i!==x.a)b.classList.add('ng')});if(i===x.a)score++;document.getElementById('res').innerHTML=`<div class="result"><b>${i===x.a?'✅ 正解！':'❌ 不正解…'}</b><br>💡 ${x.e}<button class="next" onclick="next()">${cur===9?'結果を見る':'次の問題 →'}</button></div>`}function next(){if(cur===9){document.getElementById('quiz').classList.add('hidden');document.getElementById('finish').classList.remove('hidden');let r=score*10;document.getElementById('fs').textContent=r+'%';document.getElementById('ft').textContent='10問中 '+score+'問 正解！';}else{cur++;show()}}function home(){document.getElementById('quiz').classList.add('hidden');document.getElementById('finish').classList.add('hidden');document.getElementById('home').classList.remove('hidden')}function soon(n){document.getElementById('msg').textContent='「'+n+'」はこれから追加するで！'}</script></body></html>

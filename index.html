<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IT STUDY</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#eef4ff,#f7f8fc);color:#172033;font-family:system-ui,'Noto Sans JP',sans-serif}.wrap{max-width:900px;margin:auto;padding:24px 14px}.logo{text-align:center;color:#4f6df5;font-weight:900;letter-spacing:3px}.title{text-align:center}.card{background:#fff;border:1px solid #e5e8ef;border-radius:20px;padding:20px;box-shadow:0 8px 25px #1e2d5012}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{text-align:center;background:#f5f7fb;border-radius:14px;padding:12px}.n{font-size:24px;font-weight:900}.subjects{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.subject,.choice,button{border:1px solid #dfe4ec;background:#fff;border-radius:13px;padding:14px;cursor:pointer;font-size:15px}.subject{text-align:left}.subject b{display:block;margin-top:6px}.subject small{color:#687386}.start,.next{width:100%;margin-top:16px;border:0;background:#4f6df5;color:#fff;font-weight:900}.hidden{display:none}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.q{font-size:20px;font-weight:850;line-height:1.65;margin:20px 0;white-space:pre-wrap}.choices{display:grid;gap:10px}.choice{text-align:left;line-height:1.5}.choice.ok{background:#edf9f3;border:2px solid #35a66f}.choice.ng{background:#fff0f1;border:2px solid #e05b62}.result{margin-top:15px;background:#f5f7fb;border-radius:14px;padding:15px;line-height:1.7}.score{text-align:center;font-size:46px;font-weight:900;margin:12px}.center{text-align:center}.back{background:#f0f2f7}.tag{display:inline-block;background:#eef2ff;color:#4259c8;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800}.hint{color:#687386;font-size:13px}.src{margin-top:16px;font-size:12px;color:#7b8492}.wrong{margin-top:10px;padding:10px;border-radius:10px;background:#fff7f7}@media(max-width:520px){.wrap{padding:18px 11px}.subjects{gap:7px}.q{font-size:18px}}</style></head><body><div class="wrap"><div id="home"><div class="logo">IT STUDY</div><h1 class="title">ともやの学習アプリ</h1><p class="title">「覚えた」から「判断できる」へ。</p><section class="card"><h3>📚 今日の学習状況</h3><div class="stats"><div class="stat"><div class="n" id="tq">0</div><small>問題数</small></div><div class="stat"><div class="n" id="cr">--%</div><small>正解率</small></div><div class="stat"><div class="n" id="st">0</div><small>連続正解</small></div></div></section><h3>📖 学習メニュー</h3><div class="subjects"><button class="subject" onclick="start()">🌐<b>ネットワーク</b><small>CCNA・Cisco・障害対応</small></button><button class="subject" onclick="soon('応用情報')">💻<b>応用情報</b><small>午前・午後対策</small></button><button class="subject" onclick="soon('Linux')">🐧<b>Linux</b><small>コマンド・操作</small></button><button class="subject" onclick="soon('SQL')">💾<b>SQL</b><small>SELECT・JOIN・DB</small></button></div><button class="start" onclick="start()">🚀 ネットワーク演習を始める</button><p class="hint" id="msg">全100問から毎回10問ランダム。暗記だけでなく設定・計算・障害切り分け中心。</p><div class="src">問題はCisco CCNA 200-301の出題領域とIPAのネットワーク系試験の要求スキルを参考にしたオリジナル問題。</div></div></div><div id="quiz" class="hidden"><div class="logo">NETWORK TRAINING</div><h1 class="title">🌐 実践ネットワーク演習</h1><section class="card"><div class="top"><button class="back" onclick="home()">← 戻る</button><span><span class="tag" id="cat"></span> <b id="prog"></b></span></div><div class="q" id="q"></div><div class="choices" id="cs"></div><div id="res"></div></section></div><div id="finish" class="hidden"><div class="logo">RESULT</div><h1 class="title">🎉 演習終了！</h1><section class="card center"><div>今回の正解率</div><div class="score" id="fs"></div><p id="ft"></p><button class="start" onclick="start()">もう一度挑戦</button><button class="back" onclick="home()">トップへ戻る</button></section></div></div><script>
const B=[
['IPv4','PCが192.168.10.70/26の場合、所属するネットワークアドレスは？','192.168.10.64',['192.168.10.0','192.168.10.128','192.168.10.192'],'/26は64個刻み。70は64〜127に入る。'],
['IPv4','172.16.32.10/20のネットワークアドレスは？','172.16.32.0',['172.16.0.0','172.16.16.0','172.16.48.0'],'/20は第3オクテットが16刻み。32は32〜47の範囲。'],
['IPv4','192.168.1.129/25のブロードキャストアドレスは？','192.168.1.255',['192.168.1.127','192.168.1.128','192.168.2.0'],'/25は128個刻み。129は128〜255の範囲。'],
['IPv4','10.10.20.0/27で利用可能なホスト数は？','30',['14','62','126'],'ホスト部5ビットなので2^5-2=30。'],
['IPv4','172.16.5.10/20から同一サブネットの端末はどれ？','172.16.12.20',['172.16.20.20','172.16.31.20','172.16.40.20'],'/20では第3オクテット0〜15が同一ネットワーク。'],
['Routing','ルータの経路表に10.10.0.0/16と10.10.10.0/24がある。10.10.10.5への送信で選ばれる経路は？','10.10.10.0/24',['10.10.0.0/16','0.0.0.0/0','ランダム'],'Longest Prefix Matchでより具体的な/24が優先される。'],
['Routing','宛先への経路がなく、デフォルトルートもない場合、ルータは通常どうする？','パケットを破棄する',['必ずブロードキャストする','DNSへ問い合わせる','送信元へARPする'],'一致する経路がなければ転送できない。'],
['Routing','OSPFで隣接関係が成立しないとき、まず確認する対象として不適切なのは？','Webブラウザのキャッシュ',['エリア番号','Hello/Deadタイマー','インターフェース状態'],'OSPF隣接では設定・インターフェース・タイマー等を確認する。'],
['VLAN','PCがVLAN10、サーバーがVLAN20にいる。両者を通信させるために必要なのは？','L3でのルーティング',['STPを無効化','MACアドレスの手動登録','PoE'],'VLANはL2で分離されるため、VLAN間通信にはL3処理が必要。'],
['VLAN','スイッチ間リンクでVLAN10とVLAN20を通す設定として適切なのは？','トランクポート',['アクセスポートのみ','ループバック','コンソールポート'],'複数VLANを1リンクで運ぶには通常trunkを使う。'],
['VLAN','端末接続ポートをaccess VLAN 20にした。別のVLANのタグ付きフレームを端末側へ流したくない。このポートの考え方は？','アクセスポートとして使う',['trunk専用にする','ルーティングポートにする','SPAN専用にする'],'一般端末の単一VLAN接続にはaccessが基本。'],
['VLAN','trunkでVLANを識別する標準的なタグ方式は？','IEEE 802.1Q',['IEEE 802.3af','802.11ax','LACP'],'802.1QはEthernetフレームにVLAN情報を付加する。'],
['STP','L2スイッチに冗長リンクがあり、ループを防ぎたい。主な仕組みは？','STP',['NAT','DNS','DHCP'],'STPはL2ループを防止する。'],
['STP','STPでRoot Bridgeを選出するとき、基本的に最小のBridge IDが選ばれる。優先度が同じなら何で比較する？','MACアドレス',['IPアドレス','ポート番号','ホスト名'],'Bridge IDは優先度とMACアドレス等で決まる。'],
['EtherChannel','2本の物理リンクを1つの論理リンクとして利用したい。Ciscoで代表的なネゴシエーション方式は？','LACP',['ARP','NTP','DNS'],'LACPはEtherChannelの標準的なリンク集約プロトコル。'],
['Cisco','Ciscoスイッチでポートのup/downや速度・duplex等を詳しく確認したい。適切なコマンドは？','show interfaces',['show vlan brief','show clock','show users'],'show interfacesはインターフェースの詳細状態を確認できる。'],
['Cisco','Ciscoスイッチで各インターフェースのIPとup/downを一覧で確認したい。','show ip interface brief',['show vlan brief','show mac address-table','show spanning-tree'],'IPアドレスとStatus/Protocolを一覧で確認できる。'],
['Cisco','VLANと所属ポートを一覧で確認したい。','show vlan brief',['show ip route','show cdp neighbors','show clock'],'VLAN ID、名前、Status、所属ポートを確認できる。'],
['Cisco','MACアドレステーブルを確認したい。','show mac address-table',['show ip route','show vlan brief','show interfaces trunk'],'L2スイッチが学習したMACとポートを確認できる。'],
['Cisco','トランク状態や許可VLANを確認したい。','show interfaces trunk',['show ip route','show version','show users'],'trunkの状態、native VLAN、許可VLAN等を確認できる。'],
['Cisco','ルーティングテーブルを確認したい。','show ip route',['show vlan brief','show interfaces status','show clock'],'宛先ネットワーク、次ホップ、出力IFなどを確認する。'],
['Cisco','現在のRAM上の設定を確認したい。','show running-config',['show startup-config','show ip route','show vlan brief'],'running-configは現在動作中の設定。'],
['Cisco','再起動後に使われる保存済み設定を確認したい。','show startup-config',['show running-config','show interfaces','show vlan brief'],'startup-configはNVRAM等に保存された起動時設定。'],
['Cisco','設定変更後、再起動しても残したい。代表的な操作は？','copy running-config startup-config',['copy startup-config running-config','show running-config','reloadだけ'],'running-configをstartup-configへ保存する。'],
['Troubleshooting','PCから同一LANのデフォルトゲートウェイへpingできない。まず確認する価値が高いものは？','PCのIP・サブネットマスク・VLAN設定',['インターネット上のDNSキャッシュ','BGPのAS番号','NTPサーバー時刻'],'まず端末のL2/L3設定と接続VLANを切り分ける。'],
['Troubleshooting','PCは同一VLANの端末とは通信できるが、別VLANへ通信できない。疑うべきものは？','VLAN間ルーティングとデフォルトゲートウェイ',['PoEだけ','MACアドレスの製造番号','NTPだけ'],'同一VLAN内は通るため、L3境界付近を確認する。'],
['Troubleshooting','PCからIPアドレスではサーバーへ接続できるが、ホスト名では接続できない。最も疑うものは？','DNS',['STP','PoE','EtherChannel'],'IP直打ちが成功し名前解決だけ失敗ならDNSが有力。'],
['Troubleshooting','Ciscoスイッチのポートがerr-disabledになった。次に行うべきことは？','原因を確認してerr-disableの発生理由を切り分ける',['即座に何度もreloadする','全VLANを削除する','STPを無効にする'],'port-securityやBPDU Guard等、原因を確認してから復旧する。'],
['Troubleshooting','インターフェースでCRCエラーが増加している。まず疑うものは？','物理層・ケーブル・ポート等の問題',['DNSレコード','BGPポリシーだけ','ユーザーのパスワード'],'CRCはフレーム破損の指標で、物理要因をまず確認する。'],
['Troubleshooting','片側だけduplex設定が不一致になっている。起こり得る症状は？','通信性能低下やエラー増加',['必ずIPアドレスが消える','DNS名が自動変更される','VLANが自動作成される'],'duplex mismatchは遅延・衝突・エラー等の原因になる。'],
['Security','未承認端末をスイッチポートに接続されにくくする代表的な機能は？','Port Security',['NTP','LLDPだけ','HSRP'],'Port Securityはポートで許可するMACを制限できる。'],
['Security','DHCPサーバーになりすます攻撃への対策として使われる機能は？','DHCP Snooping',['STP Root Guardだけ','NAT','DNSSEC'],'DHCP Snoopingは信頼ポート等を設定して不正DHCPを抑制する。'],
['Security','ARPを悪用した攻撃への対策としてCiscoスイッチで使われる代表的機能は？','Dynamic ARP Inspection',['DHCPだけ','FTP','CDPだけ'],'DAIはDHCP Snooping等の情報を利用してARPを検証する。'],
['Security','ACLを設定するときの基本的な注意点は？','上から順に評価され、暗黙のdenyがあることを意識する',['必ず下から評価される','ACLはL2だけで使う','全通信が初期状態で許可される'],'ACLの順序と暗黙denyを理解することが重要。'],
['IP Services','DHCPのDORAで最初にクライアントが送るメッセージは？','DHCP Discover',['DHCP ACK','DHCP Request','DHCP Offer'],'Discover→Offer→Request→ACKの順が基本。'],
['IP Services','DHCPサーバーとクライアントが別サブネットにいる。DHCPリレーで一般的に使われるCisco設定は？','ip helper-address',['ip route 0.0.0.0','switchport trunk','spanning-tree root'],'DHCPブロードキャストをルータが中継するためにip helper-addressを使う。'],
['IP Services','NATの主な目的として適切なのは？','アドレスを変換して異なるアドレス空間間を接続する',['MACを学習する','VLANを作る','時刻を同期する'],'NATはIPアドレス等を変換する仕組み。'],
['IP Services','Syslogを使う主な目的は？','機器のログを収集・記録する',['IPアドレスを自動配布する','VLANタグを付ける','MACを暗号化する'],'障害調査や監視のためにログを集中管理できる。'],
['IP Services','NTPを使う主な目的は？','機器間の時刻を同期する',['DNS名を解決する','IPを配布する','VLANを作る'],'ログの時系列を正確にするうえでも時刻同期は重要。'],
['TCP/IP','TCPの3-way handshakeで最初に送るものは？','SYN',['FIN','RST','ARP'],'SYNで接続開始を要求する。'],
['TCP/IP','TCPの3-way handshakeで2番目の応答は？','SYN/ACK',['FIN/ACK','RST/ACK','ARP/ACK'],'サーバー側がSYN/ACKを返す。'],
['TCP/IP','UDPを使うことが多いサービスはどれ？','DNS問い合わせ',['SSH接続','HTTPS接続','FTP制御接続'],'DNSは一般的な問い合わせでUDP 53を使う。'],
['IPv6','IPv6でARPの代わりに近隣探索を行う仕組みは？','NDP',['STP','LACP','RIP'],'NDPはICMPv6を利用して近隣探索等を行う。'],
['IPv6','IPv6のリンクローカルアドレスが主に使われる範囲は？','同一リンク内',['インターネット全体','別AS間','全世界のDNS'],'リンクローカルは同一リンク内で利用される。'],
['Wireless','APと無線クライアントの間を管理・制御する仕組みとして正しいのは？','WLAN',['VLANだけ','NATだけ','BGPだけ'],'WLANは無線LANの論理的なネットワーク構成を指す。'],
['Automation','ネットワーク機器をAPI経由で自動設定する考え方として適切なのは？','Automation / Programmability',['手動コンソールのみ','物理配線のみ','DNSキャッシュ'],'CCNAでもAutomation and Programmabilityが出題領域に含まれる。'],
['Automation','REST APIで一般的にリソース取得に使われるHTTPメソッドは？','GET',['POSTだけ','DELETEだけ','PATCHだけ'],'GETはリソース取得に使う代表的なHTTPメソッド。'],
['Design','複数のスイッチを階層化し、アクセス・ディストリビューション・コアに分ける設計は？','3-tier階層型',['リング型だけ','SOHO型だけ','P2P型'],'3-tierはアクセス、ディストリビューション、コアの階層で設計する。'],
['Design','Spine-Leaf構成の特徴として適切なのは？','LeafとSpineを規則的に接続し、東西トラフィックに向く',['全端末を1台へ直列接続','DNS専用構成','VLANを使えない'],'データセンター等で予測しやすい経路を作る構成として使われる。']
];
const mk=(x,v,i)=>{let[a,q,c,d,e]=x;let qq=v?q.replace('？','。次の判断として最も適切なのは？'):q;let opts=[c,...d].sort(()=>Math.random()-.5);return{id:i*2+v+1,cat:a,q:qq,opts,ans:c,exp:e}};
const BANK=B.flatMap((x,i)=>[mk(x,0,i),mk(x,1,i)]);let quiz=[],idx=0,score=0,answered=false;
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function start(){quiz=shuffle(BANK).slice(0,10);idx=0;score=0;answered=false;document.getElementById('home').classList.add('hidden');document.getElementById('finish').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');show()}
function show(){answered=false;let x=quiz[idx];document.getElementById('cat').textContent=x.cat;document.getElementById('prog').textContent=`${idx+1} / ${quiz.length}`;document.getElementById('q').textContent=x.q;let c=document.getElementById('cs');c.innerHTML='';document.getElementById('res').innerHTML='';x.opts.forEach(o=>{let b=document.createElement('button');b.className='choice';b.textContent=o;b.onclick=()=>answer(b,o);c.appendChild(b)})}
function answer(btn,o){if(answered)return;answered=true;let x=quiz[idx];document.querySelectorAll('.choice').forEach(b=>{if(b.textContent===x.ans)b.classList.add('ok')});if(o===x.ans){score++;btn.classList.add('ok')}else{btn.classList.add('ng')}document.getElementById('res').innerHTML=`<div class="result"><b>${o===x.ans?'⭕ 正解！':'❌ 不正解'}</b><br>${x.exp}${o!==x.ans?`<div class="wrong">正解：<b>${x.ans}</b></div>`:''}<button class="next" onclick="next()">${idx===quiz.length-1?'結果を見る':'次の問題へ →'}</button></div>`}
function next(){if(idx===quiz.length-1){finish()}else{idx++;show()}}
function finish(){document.getElementById('quiz').classList.add('hidden');document.getElementById('finish').classList.remove('hidden');let p=Math.round(score/quiz.length*100);document.getElementById('fs').textContent=p+'%';document.getElementById('ft').textContent=`10問中 ${score}問正解。${p>=80?'かなりええ感じ！次は実務問題を増やそう🔥':p>=60?'基礎は見えてきた。間違えた分野を復習しよう💪':'まだ伸びしろ大きいで。解説を読みながらもう一周いこう！'}`;document.getElementById('tq').textContent=(+localStorage.tq||0)+10;localStorage.tq=(+localStorage.tq||0)+10;localStorage.cr=p+'%';document.getElementById('cr').textContent=p+'%'}
function home(){document.getElementById('quiz').classList.add('hidden');document.getElementById('finish').classList.add('hidden');document.getElementById('home').classList.remove('hidden')}
function soon(s){alert(`${s}は次のアップデートで追加予定やで！`)}
document.getElementById('tq').textContent=localStorage.tq||0;document.getElementById('cr').textContent=localStorage.cr||'--%';
</script></body></html>

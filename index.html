<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IT STUDY</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#172033;font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif}.wrap{max-width:900px;margin:auto;padding:22px 14px}.logo{text-align:center;color:#4967e8;font-weight:900;letter-spacing:3px}.title{text-align:center}.card{background:#fff;border:1px solid #e2e7f0;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 6px 22px #18264a10}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f6f8fc;border-radius:12px;text-align:center;padding:12px}.n{font-size:23px;font-weight:900}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.btn,button{border:1px solid #dfe4ed;background:#fff;border-radius:12px;padding:13px;cursor:pointer;font-size:15px}.primary{background:#4967e8;color:white;border:0;font-weight:800}.full{width:100%;margin-top:12px}.hidden{display:none}.q{font-size:19px;font-weight:800;line-height:1.65;margin:16px 0}.choices{display:grid;gap:9px}.choice{text-align:left;white-space:pre-wrap}.ok{border:2px solid #27a66b;background:#eefaf4}.ng{border:2px solid #df5c64;background:#fff1f2}.pre{background:#101827;color:#e8eefc;border-radius:12px;padding:14px;overflow:auto;font:13px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre}.ex{margin-top:13px;padding:14px;background:#f5f7fb;border-radius:12px;line-height:1.65}.tag{display:inline-block;background:#e9edff;color:#425dd1;border-radius:99px;padding:4px 9px;font-size:12px;font-weight:800}.top{display:flex;justify-content:space-between;gap:8px;align-items:center}.muted{color:#667085}.score{text-align:center;font-size:46px;font-weight:900}.center{text-align:center}@media(max-width:560px){.grid{grid-template-columns:1fr}.q{font-size:17px}.wrap{padding:16px 10px}}</style></head><body><div class="wrap"><div id="home"><div class="logo">IT STUDY</div><h1 class="title">ともやの学習アプリ</h1><p class="title muted">CCNA＋C9200実務トレーニング</p><section class="card"><h3>📚 学習状況</h3><div class="stats"><div class="stat"><div class="n" id="tq">0</div><small>解答数</small></div><div class="stat"><div class="n" id="cr">--%</div><small>正解率</small></div><div class="stat"><div class="n" id="st">0</div><small>連続正解</small></div></div></section><section class="card"><h3>🌐 ネットワーク</h3><div class="grid"><button class="btn primary" onclick="start('all')">🔥 実務＋CCNA</button><button class="btn" onclick="start('cisco')">🛠️ C9200・Cisco</button><button class="btn" onclick="start('subnet')">🔢 IP・サブネット</button><button class="btn" onclick="start('basic')">📖 基礎確認</button></div><button class="btn full primary" onclick="start('all')">🚀 10問ランダム開始</button><p class="muted">※実際のCisco IOS XEのshow出力を参考にしたオリジナル問題</p></section></div><div id="quiz" class="hidden"><div class="logo">NETWORK TRAINING</div><div class="top"><button onclick="home()">← 戻る</button><b id="prog"></b></div><section class="card"><div id="meta"></div><div id="q"></div><div id="cmd"></div><div class="choices" id="cs"></div><div id="res"></div></section></div><div id="finish" class="hidden"><div class="logo">RESULT</div><h1 class="title">🎉 終了！</h1><section class="card center"><div>今回の正解率</div><div class="score" id="fs"></div><p id="ft"></p><button class="btn primary full" onclick="start('all')">もう一度</button><button class="btn full" onclick="home()">トップへ</button></section></div></div><script>
const Q=[
{c:'cisco',q:'C9200でGi1/0/10が端末接続用なのにVLAN20へ入っていない。どのコマンドでまず確認する？',cmd:'Switch# show vlan brief',a:'show vlan brief',o:['show ip route','show clock','show version'],e:'VLANと各アクセスポートの所属を一覧で確認できる。Cisco公式でもVLAN確認に使用される。'},
{c:'cisco',q:'Gi1/0/24がスイッチ間リンク。VLAN10/20/30を通したい。設定として適切なのは？',cmd:'Switch(config-if)# ?',a:'switchport mode trunk と allowed vlan の確認',o:['switchport access vlan 10だけ','ip address 10.0.0.1 255.255.255.0だけ','shutdown'],e:'スイッチ間で複数VLANを運ぶならtrunk。必要に応じてswitchport trunk allowed vlanで許可VLANを絞る。'},
{c:'cisco',q:'「VLAN20だけスイッチ間で通信できない」。trunkで許可されているVLANを確認したい。',cmd:'Switch# show interfaces Gi1/0/24 trunk',a:'show interfaces Gi1/0/24 trunk',o:['show vlan briefだけ','show ip route','show arp'],e:'show interfaces interface-id trunkはtrunk状態と許可VLANなどを確認するための代表コマンド。'},
{c:'cisco',q:'端末が通信できない。Gi1/0/10の管理状態と実際のリンク状態を手早く一覧確認したい。',cmd:'Switch# ?',a:'show ip interface brief',o:['show vlan database','show spanning-tree detailだけ','show cdp neighbors detail'],e:'show ip interface briefはインターフェースのStatus/ProtocolとIP情報を一覧確認できる。L2ポートでも状態確認に便利。'},
{c:'cisco',q:'次の出力から判断できることは？',cmd:'Gi1/0/10 is administratively down, line protocol is down',a:'管理者によってshutdownされている',o:['ケーブル断だけが確定','VLANが存在しない','DNS障害'],e:'administratively downはshutdownなど管理上無効になっていることを示す。'},
{c:'cisco',q:'次の状態。物理リンクは上がっているが上位プロトコルが下がっている。最初に疑うべき層は？',cmd:'GigabitEthernet1/0/10 is up, line protocol is down',a:'L2設定や対向とのネゴシエーション',o:['電源断だけ','CPU故障だけ','DNSだけ'],e:'物理層はupだがline protocolがdown。L2設定、trunk/access不一致、対向状態などを切り分ける。'},
{c:'cisco',q:'show interfaces trunkでVLAN20が「allowed」にはない。VLAN20通信不能の原因として最も直接的なのは？',cmd:'Vlans allowed on trunk: 10,30',a:'trunkでVLAN20が許可されていない',o:['VLAN20のIPが必ず間違い','STPが必ず無効','MACアドレスが48bitではない'],e:'allowed VLANリストに20がなければtrunkを通れない。'},
{c:'cisco',q:'次の設定のGi1/0/5は何用？',cmd:'interface Gi1/0/5\nswitchport mode access\nswitchport access vlan 20',a:'VLAN20の端末接続用アクセスポート',o:['VLAN20専用のルータ','trunkポート','L3ルーテッドポート'],e:'accessモードでaccess vlan 20なので、端末をVLAN20へ収容する設定。'},
{c:'cisco',q:'show vlan briefでVLAN20は存在するが、Gi1/0/5がVLAN10に表示されている。VLAN20へ収容する設定は？',cmd:'Switch(config-if)#',a:'switchport access vlan 20',o:['switchport trunk vlan 20','ip route vlan 20','router vlan 20'],e:'アクセスポートの所属VLANはswitchport access vlanで設定する。'},
{c:'cisco',q:'C9200で現在の設定と保存済み設定の違いを確認したい。保存済み設定を見るコマンドは？',cmd:'Switch# ?',a:'show startup-config',o:['show running-config','show vlan brief','show interfaces trunk'],e:'running-configは現在稼働中、startup-configは再起動時に読み込む保存済み設定。'},
{c:'cisco',q:'設定変更後、再起動すると消えてしまった。変更を保存する代表的な操作は？',cmd:'Switch#',a:'copy running-config startup-config',o:['copy startup-config running-configだけ','show running-config','reloadだけ'],e:'現在のrunning-configをstartup-configへ保存する。'},
{c:'cisco',q:'スイッチのMACアドレステーブルを確認し、Gi1/0/10の先にどのMACが学習されているか調べたい。',cmd:'Switch# ?',a:'show mac address-table',o:['show ip route','show vlan brief','show users'],e:'MACアドレステーブルはL2転送判断の重要な確認ポイント。'},
{c:'cisco',q:'同一VLAN内の端末同士が通信できない。MACアドレステーブルに相手MACが全く学習されていない。まず確認したいのは？',cmd:'show mac address-table dynamic',a:'物理リンク・ポート状態と端末からのフレーム到達',o:['BGPのAS番号だけ','DNS MXレコード','NTP stratumだけ'],e:'MACが学習されないなら、まず端末からフレームが届いているか、ポートがupかを切り分ける。'},
{c:'cisco',q:'show spanning-tree vlan 20でGi1/0/24がBlocking/Alternate相当。これは何を示す？',cmd:'show spanning-tree vlan 20',a:'L2ループ防止のため、その経路が転送に使われていない',o:['必ずポート故障','必ずVLAN削除','IPアドレス重複'],e:'STPは冗長リンクによるL2ループを防ぐため、経路の一部を非転送状態にする。'},
{c:'cisco',q:'STPでRoot Bridgeを確認したい。どの情報を見る？',cmd:'show spanning-tree vlan 20',a:'Root IDと現在スイッチのRoot/Port情報',o:['DNSサーバー情報','NAT変換表','ARPタイマーだけ'],e:'show spanning-treeでVLANごとのRoot ID、ポート状態などを確認できる。'},
{c:'cisco',q:'EtherChannelのメンバーリンクに設定不一致がないか調べたい。代表的な確認は？',cmd:'Switch# ?',a:'show etherchannel summary',o:['show ip dns','show vlan name','show ntp associationsだけ'],e:'show etherchannel summaryでPort-channelとメンバーの状態を確認する。'},
{c:'cisco',q:'LACPを使ったEtherChannelで、片側だけ設定が違う。起こり得る問題は？',cmd:'Port-channel configuration mismatch',a:'EtherChannelが正常に形成されない',o:['必ずDNSが停止','IPアドレスが自動変更','VLANが全て削除'],e:'チャネル形成条件やメンバー設定が合わないと正常なEtherChannelにならない。'},
{c:'cisco',q:'show ip routeで「C 192.168.20.0/24 is directly connected, Vlan20」とある。意味は？',cmd:'C 192.168.20.0/24 is directly connected, Vlan20',a:'192.168.20.0/24はVlan20に直接接続されたネットワーク',o:['OSPF学習経路','デフォルトルート','静的NAT'],e:'CはConnected。SはStatic、OはOSPFなど、先頭記号で経路種別を判断できる。'},
{c:'cisco',q:'宛先10.10.20.50への経路を調べたい。まず見るべきものは？',cmd:'Switch# ?',a:'show ip route 10.10.20.50',o:['show vlan 10.10.20.50','show mac 10.10.20.50','ping route'],e:'特定宛先へのルーティング判断を確認するならshow ip routeに宛先を指定する。'},
{c:'cisco',q:'PCは同一VLAN内にはpingできるが、別VLANへpingできない。L2疎通が確認済み。次に重要なのは？',cmd:'PC → VLAN10 / destination → VLAN20',a:'デフォルトゲートウェイとVLAN間ルーティング',o:['MACアドレスの製造元','NTP','PoEだけ'],e:'別VLANはL3ルーティングが必要。PCのGW、SVI/ルータ、ルーティング状態を確認する。'},
{c:'cisco',q:'SVI Vlan20が「administratively down」だった。何が考えられる？',cmd:'Vlan20 is administratively down, line protocol is down',a:'SVIがshutdownされている、または関連条件を確認する',o:['必ずDNS障害','必ずSTP Root','必ずケーブル断'],e:'administratively downは管理上down。SVI設定とno shutdown、VLAN存在などを確認する。'},
{c:'cisco',q:'DHCPクライアントがIPを取得できない。C9200でDHCP Snoopingを使っている。まず疑うべき設定は？',cmd:'show ip dhcp snooping',a:'DHCPサーバー側ポートがtrustedになっているか',o:['NTPがstratum 1か','STP Root IDだけ','DNS MX'],e:'DHCP SnoopingではDHCP serverからの応答がtrustedポートを通る設計か確認する。'},
{c:'cisco',q:'ARPスプーフィング対策としてDAIを使っている。DAIが検証する対象として適切なのは？',cmd:'Dynamic ARP Inspection',a:'ARPパケットのIP-MAC対応など',o:['HTTP URLだけ','CPU使用率だけ','DNS TTLだけ'],e:'DAIは不正なARPを検査し、DHCP Snooping binding databaseなどを利用する構成が一般的。'},
{c:'cisco',q:'Port Securityで違反が発生した可能性がある。確認したいコマンドは？',cmd:'Switch# ?',a:'show port-security interface Gi1/0/10',o:['show ip route only','show vlan name only','show ntp status only'],e:'対象インターフェースのPort Security状態・違反などを確認できる。'},
{c:'cisco',q:'ログに「LINK-3-UPDOWN」が繰り返し出る。何を切り分ける？',cmd:'%LINK-3-UPDOWN: Interface Gi1/0/10, changed state to down',a:'物理リンク、ケーブル、対向機器、インターフェース状態',o:['DNSゾーンだけ','ユーザーPWだけ','VLAN名だけ'],e:'LINK状態の変化なので、まず物理・インターフェース・対向状態を確認する。'},
{c:'cisco',q:'インターフェースでCRCエラーが増加している。最初に疑うものは？',cmd:'input errors / CRC',a:'ケーブルや物理層の品質問題',o:['DNS名前解決','OSPF Router IDだけ','NTP'],e:'CRCはフレーム破損を示す代表的な兆候。ケーブル、光/銅、対向ポートなどを確認する。'},
{c:'cisco',q:'show interfacesでinput errorsが増えている。次の切り分けとして有効なのは？',cmd:'show interfaces Gi1/0/10',a:'CRC、速度/duplex、ケーブル、対向側のエラーを確認',o:['DNSキャッシュだけ削除','VLAN名を変更','NTP再起動だけ'],e:'input errorsの内訳と物理条件を確認して原因を絞る。'},
{c:'cisco',q:'2台のスイッチ間でVLAN10だけ通信できない。両端のポートはup。最も効率的な次の確認は？',cmd:'両端とも Gi1/0/24 up',a:'両端のtrunk設定とallowed VLANを比較',o:['PCの壁紙を確認','NTPだけ再起動','CPU名を変更'],e:'リンクupでもVLAN単位の設定不一致は起こるため、trunkとallowed VLANを両端比較する。'},
{c:'subnet',q:'PC 172.16.5.10/20のネットワークアドレスは？',cmd:'/20 = 255.255.240.0',a:'172.16.0.0',o:['172.16.5.0','172.16.16.0','172.16.255.0'],e:'第3オクテットのブロックサイズは16。5は0～15に入るため172.16.0.0/20。'},
{c:'subnet',q:'192.168.10.70/26のブロードキャストアドレスは？',cmd:'/26 → 64個刻み',a:'192.168.10.127',o:['192.168.10.63','192.168.10.70','192.168.10.128'],e:'/26は0-63,64-127,128-191,192-255。70は64-127に属する。'},
{c:'subnet',q:'10.0.8.0/21の利用可能ホスト数は？',cmd:'/21 → ホスト部11bit',a:'2046',o:['1022','4094','2048'],e:'2^11 - 2 = 2046。ネットワークアドレスとブロードキャストを除く。'},
{c:'subnet',q:'IPv6のfe80::/10は何に使われる？',cmd:'IPv6 prefix',a:'リンクローカル',o:['マルチキャスト','ループバック','グローバルユニキャスト'],e:'fe80::/10はIPv6 link-local。NDPなど同一リンク内の通信で使われる。'},
{c:'basic',q:'PCから10.0.0.1へping。ARPで解決する対象は？',cmd:'同一LAN上の10.0.0.1',a:'10.0.0.1のMACアドレス',o:['DNS名','TCPポート80','デフォルトルートのMACだけ'],e:'同一リンク上の宛先IPへ送るにはARPで宛先MACを解決する。別ネットワークなら通常GWのMACを解決する。'},
{c:'basic',q:'PCから別ネットワークのサーバーへ通信するとき、Ethernetフレームの宛先MACは基本的に誰になる？',cmd:'PC 192.168.10.10 → Server 10.0.0.10',a:'デフォルトゲートウェイのMAC',o:['最終サーバーのMAC','DNSサーバーのMAC','宛先IPと同じ値'],e:'IP宛先は最終サーバーだが、同一LANでないためL2ではデフォルトGWへフレームを送る。'},
{c:'basic',q:'DNSが正常でも、IPアドレスを直接指定したpingが失敗する。DNSだけが原因と断定できる？',cmd:'ping 10.0.0.10 → timeout',a:'できない。DNSとは別にL3/L4/ACL/端末FWなどを切り分ける',o:['必ずDNSが原因','必ずVLAN名が原因','必ずNTPが原因'],e:'IP直打ちなら名前解決を経由しない。経路、ACL、FW、宛先状態などを確認する。'},
{c:'basic',q:'HTTPSの標準TCPポートは？',cmd:'TCP connection',a:'443',o:['22','53','161'],e:'HTTPSは通常TCP 443。SSHは22、DNSは53が代表的。'},
{c:'basic',q:'TCPとUDPのうち、一般に接続確立や再送など信頼性機能を持つのは？',cmd:'Transport layer',a:'TCP',o:['UDP','ARP','ICMP'],e:'TCPはコネクション指向で順序制御や再送などを提供する。'}
];
let qs=[],i=0,score=0,answered=false,stats=JSON.parse(localStorage.getItem('itstats')||'{"q":0,"ok":0,"st":0}');
function save(){localStorage.setItem('itstats',JSON.stringify(stats));document.getElementById('tq').textContent=stats.q;document.getElementById('cr').textContent=stats.q?Math.round(stats.ok/stats.q*100)+'%':'--%';document.getElementById('st').textContent=stats.st}function shuffle(a){return a.sort(()=>Math.random()-.5)}function start(cat){let pool=cat==='all'?Q:Q.filter(x=>x.c===cat);qs=shuffle([...pool]).slice(0,Math.min(10,pool.length));i=0;score=0;answered=false;document.getElementById('home').classList.add('hidden');document.getElementById('finish').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');show()}function show(){answered=false;let x=qs[i];document.getElementById('prog').textContent=(i+1)+' / '+qs.length;document.getElementById('meta').innerHTML='<span class="tag">'+x.c.toUpperCase()+'</span>';document.getElementById('q').textContent=x.q;document.getElementById('cmd').innerHTML=x.cmd?'<div class="pre">'+x.cmd+'</div>':'';let opts=shuffle([x.a,...x.o]);document.getElementById('cs').innerHTML=opts.map(v=>'<button class="choice" onclick="ans(this,\''+encodeURIComponent(v)+'\')">'+esc(v)+'</button>').join('');document.getElementById('res').innerHTML=''}function esc(s){return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}function ans(el,v){if(answered)return;answered=true;let x=qs[i],chosen=decodeURIComponent(v),ok=chosen===x.a;el.classList.add(ok?'ok':'ng');if(!ok)[...document.querySelectorAll('.choice')].find(b=>b.textContent===x.a)?.classList.add('ok');if(ok){score++;stats.ok++;stats.st++}else stats.st=0;stats.q++;save();document.getElementById('res').innerHTML='<div class="ex"><b>'+(ok?'⭕ 正解！':'❌ 不正解')+'</b><br>正解：'+esc(x.a)+'<br><br>'+esc(x.e)+'</div><button class="btn primary full" onclick="next()">'+(i===qs.length-1?'結果を見る':'次の問題 →')+'</button>'}function next(){if(i<qs.length-1){i++;show()}else finish()}function finish(){document.getElementById('quiz').classList.add('hidden');document.getElementById('finish').classList.remove('hidden');let p=Math.round(score/qs.length*100);document.getElementById('fs').textContent=p+'%';document.getElementById('ft').textContent=score+' / '+qs.length+'問正解。'+(p>=80?'ええ感じ！次はshow出力をもっと速く読めるようにしよう🔥':p>=60?'あと一歩！間違えた分野を復習しよう💪':'ここから伸ばせるで。原因切り分けを意識して復習しよう🛠️')}function home(){document.getElementById('quiz').classList.add('hidden');document.getElementById('finish').classList.add('hidden');document.getElementById('home').classList.remove('hidden');save()}save();
</script></body></html>

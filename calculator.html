<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ともやの電卓</title>
  <style>
    body { font-family: sans-serif; display:flex; justify-content:center; margin-top:50px; }
    .calculator { width:280px; }
    #display { width:100%; box-sizing:border-box; font-size:28px; padding:15px; text-align:right; margin-bottom:10px; }
    .buttons { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
    button { font-size:22px; padding:18px 5px; cursor:pointer; }
    .zero { grid-column:span 2; }
  </style>
</head>
<body>
  <div class="calculator">
    <input id="display" value="0" readonly>
    <div class="buttons">
      <button onclick="clearDisplay()">C</button>
      <button onclick="append('/')">÷</button>
      <button onclick="append('*')">×</button>
      <button onclick="backspace()">⌫</button>
      <button onclick="append('7')">7</button>
      <button onclick="append('8')">8</button>
      <button onclick="append('9')">9</button>
      <button onclick="append('-')">−</button>
      <button onclick="append('4')">4</button>
      <button onclick="append('5')">5</button>
      <button onclick="append('6')">6</button>
      <button onclick="append('+')">+</button>
      <button onclick="append('1')">1</button>
      <button onclick="append('2')">2</button>
      <button onclick="append('3')">3</button>
      <button onclick="calculate()">=</button>
      <button class="zero" onclick="append('0')">0</button>
      <button onclick="append('.')">.</button>
      <button onclick="percent()">%</button>
    </div>
  </div>
  <script>
    const display = document.getElementById('display');
    function append(value) {
      if (display.value === '0' && /[0-9.]/.test(value)) display.value = value;
      else display.value += value;
    }
    function clearDisplay() { display.value = '0'; }
    function backspace() { display.value = display.value.length > 1 ? display.value.slice(0, -1) : '0'; }
    function percent() {
      const match = display.value.match(/(\d+(?:\.\d+)?)$/);
      if (!match) return;
      const number = Number(match[1]) / 100;
      display.value = display.value.slice(0, -match[1].length) + number;
    }
    function calculate() {
      try {
        if (!/^[0-9+\-*/. ]+$/.test(display.value)) throw new Error();
        display.value = Function('"use strict"; return (' + display.value + ')')();
      } catch { display.value = 'Error'; }
    }
  </script>
</body>
</html>

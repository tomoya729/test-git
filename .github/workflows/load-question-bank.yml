name: Load question bank
on:
  push:
    paths:
      - 'questions*.js'
      - '.github/workflows/load-question-bank.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Merge all question banks into app
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          app = Path('hoken.html')
          s = app.read_text(encoding='utf-8')
          files = [p for p in Path('.').glob('questions*.js') if re.fullmatch(r'questions\d*\.js', p.name)]
          files.sort(key=lambda p: 1 if p.name == 'questions.js' else int(re.search(r'\d+', p.name).group()))
          tags = ''.join(f'<script src="{p.name}"></script>' for p in files)
          pattern = r'(?:<script src="questions\d*\.js"></script>)+'
          s, n = re.subn(pattern, tags, s, count=1)
          if n == 0:
              marker = '<script>\nconst questions='
              if marker not in s:
                  raise SystemExit('question marker not found')
              s = s.replace(marker, tags + '<script>\nconst questions=', 1)
          refs=[]
          for p in files:
              if p.name == 'questions.js': refs.append('...(window.questionExtras||[])')
              else:
                  num=re.search(r'\d+',p.name).group()
                  refs.append(f'...(window.questionExtras{num}||[])')
          question_array='const questions=['+','.join(refs)+'];'
          s,n2=re.subn(r'const questions=\[[^\n]*\];',question_array,s,count=1)
          if n2==0: raise SystemExit('questions array not found')
          app.write_text(s,encoding='utf-8')
          print('Loaded:',', '.join(p.name for p in files))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot].users.noreply.github.com'
          git add hoken.html
          git diff --cached --quiet || git commit -m 'Auto-load all question banks'
          git push
# Question-bank loader intentionally watches every questions*.js file.

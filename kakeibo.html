<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#222"><link rel="manifest" href="manifest.json"><title>💰 家計簿アプリ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;transition:.2s}button,input,select{font:inherit}button{cursor:pointer;border:0}.app{max-width:900px;margin:auto;padding:16px 12px 50px}.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.header h1{margin:0;font-size:24px}.iconbtn{width:42px;height:42px;border-radius:50%;background:var(--card);color:var(--text);box-shadow:0 2px 10px #0001}.monthbar{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:14px}.monthbar button{width:40px;height:40px;border-radius:50%;background:var(--card);color:var(--text);box-shadow:0 2px 8px #0001}.monthbar input{padding:9px 12px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);font-weight:700}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.card,.panel{background:var(--card);border-radius:17px;box-shadow:0 2px 12px #0000000d}.card{padding:14px 10px}.card span{font-size:12px;color:var(--muted)}.card strong{display:block;margin-top:5px;font-size:18px}.income strong{color:#16803c}.expense strong{color:#c0392b}.balance strong{color:#2455a4}.invest strong{color:#7950a8}.panel{margin-top:14px;padding:16px}.panel h2{margin:0 0 12px;font-size:18px}.form{display:grid;grid-template-columns:1fr 1fr;gap:9px}.form input,.form select{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text)}.amount{grid-column:span 2;font-size:22px}.wide{grid-column:span 2}.primary{padding:13px;border-radius:11px;background:#222;color:#fff;font-weight:700}.secondary{padding:10px 12px;border-radius:10px;background:var(--button);color:var(--text)}.budgetrow{display:flex;justify-content:space-between;gap:10px;align-items:center}.budgetbar{height:12px;background:var(--button);border-radius:99px;overflow:hidden;margin-top:9px}.budgetbar i{display:block;height:100%;background:#4b83d1;width:0;transition:.3s}.budgetbar i.over{background:#d9534f}.muted{color:var(--muted);font-size:13px}.tools{display:flex;flex-wrap:wrap;gap:8px}.filter{display:grid;grid-template-columns:1fr 150px;gap:8px;margin-bottom:8px}.filter input,.filter select{padding:10px;border:1px solid var(--border);border-radius:9px;background:var(--card);color:var(--text)}.item{display:grid;grid-template-columns:82px 1fr auto auto;gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}.item:last-child{border-bottom:0}.item small{color:var(--muted)}.item span{font-weight:600}.item em{display:block;font-size:12px;color:var(--muted);font-style:normal;font-weight:400}.edit,.delete{padding:7px 9px;border-radius:8px;background:var(--button);color:var(--text)}.delete{color:#c0392b}.empty{text-align:center;color:var(--muted);padding:22px}.tabs{display:flex;gap:7px;margin-bottom:12px}.tab{flex:1;padding:10px;border-radius:9px;background:var(--button);color:var(--text)}.tab.active{background:#222;color:#fff}.hidden{display:none!important}.chartwrap{width:100%;display:flex;justify-content:center;overflow:hidden}.chartwrap canvas{max-width:100%;height:auto}.yeargrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.yearcard{padding:12px;border:1px solid var(--border);border-radius:12px}.yearcard strong{display:block;margin-top:5px}.dialogback{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;padding:10px;z-index:10}.dialog{width:min(100%,560px);max-height:90vh;overflow:auto;background:var(--card);color:var(--text);border-radius:20px;padding:18px}.dialog h2{margin-top:0}.settingrow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}.danger{color:#c0392b}.lockscreen{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}.lockcard{width:min(100%,360px);background:var(--card);padding:25px;border-radius:20px;text-align:center;box-shadow:0 4px 25px #0002}.lockcard input{width:100%;padding:13px;text-align:center;font-size:22px;letter-spacing:8px;border:1px solid var(--border);border-radius:10px}.error{color:#d9534f;min-height:20px}:root{--bg:#f5f6f8;--card:#fff;--text:#222;--muted:#777;--border:#e5e5e5;--button:#eee}.dark{--bg:#111315;--card:#1d2024;--text:#f3f3f3;--muted:#aaa;--border:#34383d;--button:#2a2e33}@media(max-width:650px){.summary{grid-template-columns:1fr 1fr}.item{grid-template-columns:68px 1fr auto}.item .delete{grid-column:3}.item .edit{grid-column:3;grid-row:1}.yeargrid{grid-template-columns:1fr 1fr}}@media(max-width:420px){.app{padding:12px 9px 40px}.header h1{font-size:21px}.panel{padding:13px}.card strong{font-size:16px}}
</style>
</head>
<body>
<div id="lockscreen" class="lockscreen hidden"><div class="lockcard"><h2>🔒 家計簿</h2><p>PINを入力してください</p><input id="unlockPin" type="password" inputmode="numeric" maxlength="6" autocomplete="off"><p id="pinError" class="error"></p><button class="primary wide" onclick="unlock()">ロック解除</button></div></div>
<main class="app"><header class="header"><h1>💰 家計簿</h1><button class="iconbtn" onclick="openSettings()">⚙️</button></header>
<div class="monthbar"><button onclick="changeMonth(-1)">‹</button><input id="month" type="month"><button onclick="changeMonth(1)">›</button></div>
<section class="summary"><div class="card income"><span>収入</span><strong id="income">¥0</strong></div><div class="card expense"><span>支出</span><strong id="expense">¥0</strong></div><div class="card balance"><span>残り</span><strong id="balance">¥0</strong></div><div class="card invest"><span>投資</span><strong id="investment">¥0</strong></div></section>
<section class="panel"><h2>🎯 今月の予算</h2><div class="budgetrow"><strong id="budgetText">未設定</strong><button class="secondary" onclick="setBudget()">予算設定</button></div><div class="budgetbar"><i id="budgetBar"></i></div><p id="budgetHint" class="muted">予算を設定すると使用率を表示します</p></section>
<section class="panel"><h2>＋ お金を記録</h2><form id="form" class="form"><input id="date" type="date" required><select id="type"><option value="expense">支出</option><option value="income">収入</option></select><input id="amount" class="amount" type="number" min="1" placeholder="金額を入力" required><select id="category"><option>食費</option><option>家賃</option><option>光熱費</option><option>交通費</option><option>趣味</option><option>日用品</option><option>投資</option><option>その他</option></select><input id="note" placeholder="メモ（任意）"><button id="submitBtn" class="primary wide">記録する</button></form></section>
<section class="panel"><div class="tabs"><button id="monthTab" class="tab active" onclick="showView('month')">月の分析</button><button id="yearTab" class="tab" onclick="showView('year')">年間分析</button></div><div id="monthView"><h2>📊 支出の内訳</h2><div class="chartwrap"><canvas id="chart"></canvas></div></div><div id="yearView" class="hidden"><h2>📈 年間推移</h2><div id="yearGrid" class="yeargrid"></div></div></section>
<section class="panel"><h2>🧾 明細</h2><div class="filter"><input id="search" placeholder="カテゴリ・メモを検索"><select id="filterType"><option value="all">すべて</option><option value="expense">支出</option><option value="income">収入</option></select></div><div id="list"></div><div class="tools"><button class="secondary" onclick="exportCSV()">CSV出力</button><label class="secondary">📥 CSV取込<input id="importCSVFile" type="file" accept=".csv,text/csv" hidden onchange="importCSV(event)"></label><button class="secondary" onclick="backupJSON()">バックアップ</button><label class="secondary">復元<input id="restoreFile" type="file" accept="application/json" hidden onchange="restoreJSON(event)"></label></div><p class="muted">CSV取込は「日付,金額,カテゴリ,種別,メモ」形式に対応。CSV出力したファイルをそのまま取り込むこともできます。</p></section></main>
<div id="dialogBack" class="dialogback hidden" onclick="closeSettings(event)"><div class="dialog" onclick="event.stopPropagation()"><h2>⚙️ 設定</h2><div class="settingrow"><span>🌙 ダークモード</span><button class="secondary" onclick="toggleTheme()">切り替え</button></div><div class="settingrow"><span>🔒 PINロック</span><button class="secondary" onclick="changePin()">設定・変更</button></div><div class="settingrow"><span>🔔 通知</span><button class="secondary" onclick="requestNotify()">許可する</button></div><div class="settingrow"><span>📦 データ</span><button class="secondary" onclick="backupJSON()">JSON保存</button></div><div class="settingrow"><span>🗑️ 全データ削除</span><button class="secondary danger" onclick="clearAll()">削除</button></div><button class="primary wide" style="margin-top:14px" onclick="closeSettings()">閉じる</button></div></div>
<script>
const $=id=>document.getElementById(id);let records=JSON.parse(localStorage.getItem('kakeibo')||'[]');let settings=JSON.parse(localStorage.getItem('kakeiboSettings')||'{}');let editingId=null;const today=new Date();const dateString=d=>{const x=new Date(d);return new Date(x.getTime()-x.getTimezoneOffset()*60000).toISOString().slice(0,10)};const yen=n=>'¥'+Number(n||0).toLocaleString('ja-JP');$('date').value=dateString(today);$('month').value=dateString(today).slice(0,7);if(settings.theme==='dark')document.body.classList.add('dark');
function selected(){return records.filter(r=>r.date.startsWith($('month').value))}function save(){localStorage.setItem('kakeibo',JSON.stringify(records));render()}function render(){const rs=selected(),inc=rs.filter(r=>r.type==='income').reduce((s,r)=>s+r.amount,0),exp=rs.filter(r=>r.type==='expense').reduce((s,r)=>s+r.amount,0),inv=rs.filter(r=>r.category==='投資'&&r.type==='expense').reduce((s,r)=>s+r.amount,0);$('income').textContent=yen(inc);$('expense').textContent=yen(exp);$('balance').textContent=yen(inc-exp);$('investment').textContent=yen(inv);renderBudget(exp);renderList(rs);drawChart(rs.filter(r=>r.type==='expense'));drawYear()}
function renderList(rs){const q=$('search').value.toLowerCase(),t=$('filterType').value;const data=rs.filter(r=>(t==='all'||r.type===t)&&((r.category+' '+(r.note||'')).toLowerCase().includes(q)));$('list').innerHTML=data.length?data.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(r=>`<div class="item"><small>${r.date}</small><span>${r.category}　${r.type==='income'?'＋':'−'}${yen(r.amount)}${r.note?`<em>${escapeHtml(r.note)}</em>`:''}</span><button class="edit" onclick="editRecord(${r.id})">編集</button><button class="delete" onclick="removeRecord(${r.id})">削除</button></div>`).join(''):'<div class="empty">該当する記録はありません</div>'}function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function drawChart(rs){const c=$('chart'),ctx=c.getContext('2d'),w=Math.min(c.parentElement.clientWidth,520),h=360,dpr=devicePixelRatio||1;c.width=w*dpr;c.height=h*dpr;c.style.width=w+'px';c.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);const sums={};rs.forEach(r=>sums[r.category]=(sums[r.category]||0)+r.amount);const entries=Object.entries(sums);if(!entries.length){ctx.fillStyle='#888';ctx.font='18px sans-serif';ctx.textAlign='center';ctx.fillText('まだ支出がありません',w/2,h/2);return}const total=entries.reduce((s,[,v])=>s+v,0),cx=w/2,cy=135,r=Math.min(105,w*.25);let a=-Math.PI/2;entries.forEach(([,v],i)=>{const da=v/total*Math.PI*2;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,a,a+da);ctx.closePath();ctx.fillStyle=`hsl(${i*55},65%,55%)`;ctx.fill();a+=da});ctx.fillStyle=getComputedStyle(document.body).getPropertyValue('--text');ctx.font='bold 18px sans-serif';ctx.textAlign='center';ctx.fillText(yen(total),cx,cy+7);ctx.textAlign='left';ctx.font='14px sans-serif';entries.forEach(([k,v],i)=>ctx.fillText(`${k}: ${yen(v)}`,18,280+i*22))}
function drawYear(){const y=$('month').value.slice(0,4);$('yearGrid').innerHTML=Array.from({length:12},(_,i)=>{const m=String(i+1).padStart(2,'0'),rs=records.filter(r=>r.date.startsWith(`${y}-${m}`)),inc=rs.filter(r=>r.type==='income').reduce((s,r)=>s+r.amount,0),exp=rs.filter(r=>r.type==='expense').reduce((s,r)=>s+r.amount,0);return `<div class="yearcard"><span>${i+1}月</span><strong>${yen(inc-exp)}</strong><small class="muted">支出 ${yen(exp)}</small></div>`}).join('')}
function renderBudget(exp){const key='budget_'+$('month').value,budget=Number(localStorage.getItem(key)||0);$('budgetText').textContent=budget?yen(budget):'未設定';const bar=$('budgetBar');if(!budget){bar.style.width='0%';$('budgetHint').textContent='予算を設定すると使用率を表示します';return}const pct=Math.min(exp/budget*100,100);bar.style.width=pct+'%';bar.classList.toggle('over',exp>budget);$('budgetHint').textContent=`使用 ${yen(exp)} / 残り ${yen(budget-exp)}（${Math.round(exp/budget*100)}%）`}
function setBudget(){const key='budget_'+$('month').value,value=prompt('今月の支出予算を入力（円）',localStorage.getItem(key)||'');if(value===null)return;if(value===''||Number(value)<0)localStorage.removeItem(key);else localStorage.setItem(key,String(Math.floor(Number(value))));render()}
$('form').addEventListener('submit',e=>{e.preventDefault();const data={date:$('date').value,amount:Number($('amount').value),category:$('category').value,type:$('type').value,note:$('note').value.trim()};if(!data.amount)return;if(editingId){Object.assign(records.find(x=>x.id===editingId),data);editingId=null;$('submitBtn').textContent='記録する'}else records.push({id:Date.now(),...data});e.target.reset();$('date').value=dateString(today);save()});function editRecord(id){const r=records.find(x=>x.id===id);$('date').value=r.date;$('amount').value=r.amount;$('category').value=r.category;$('type').value=r.type;$('note').value=r.note||'';editingId=id;$('submitBtn').textContent='更新する';scrollTo({top:0,behavior:'smooth'})}function removeRecord(id){if(confirm('この記録を削除しますか？')){records=records.filter(r=>r.id!==id);save()}}
function changeMonth(n){const d=new Date($('month').value+'-01');d.setMonth(d.getMonth()+n);$('month').value=d.toISOString().slice(0,7);render()}$('month').addEventListener('change',render);$('search').addEventListener('input',renderList);$('filterType').addEventListener('change',renderList);window.addEventListener('resize',render);function showView(v){$('monthView').classList.toggle('hidden',v!=='month');$('yearView').classList.toggle('hidden',v!=='year');$('monthTab').classList.toggle('active',v==='month');$('yearTab').classList.toggle('active',v==='year');if(v==='year')drawYear()}
function openSettings(){$('dialogBack').classList.remove('hidden')}function closeSettings(e){if(!e||e.target===$('dialogBack'))$('dialogBack').classList.add('hidden')}function toggleTheme(){document.body.classList.toggle('dark');settings.theme=document.body.classList.contains('dark')?'dark':'light';localStorage.setItem('kakeiboSettings',JSON.stringify(settings));render()}
function backupJSON(){const blob=new Blob([JSON.stringify({version:2,exportedAt:new Date().toISOString(),records,settings},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kakeibo-backup.json';a.click();URL.revokeObjectURL(a.href)}function restoreJSON(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!Array.isArray(data.records))throw new Error();if(confirm(`${data.records.length}件のデータを復元します。現在のデータは置き換わります。`)){records=data.records;localStorage.setItem('kakeibo',JSON.stringify(records));render();alert('復元しました！')}}catch{alert('バックアップファイルを読み込めませんでした')}};reader.readAsText(file);e.target.value=''}
function csvParse(text){text=text.replace(/^\uFEFF/,'');const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const ch=text[i];if(ch==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(ch===','&&!quoted){row.push(cell);cell=''}else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(v=>v.trim()!==''))rows.push(row);row=[];cell=''}else cell+=ch}if(cell!==''||row.length){row.push(cell);rows.push(row)}return rows}
function normalizeDate(v){v=String(v||'').trim();if(/^\d{4}[-\/]\d{1,2}[-\/]\d{1,2}$/.test(v)){const p=v.split(/[-\/]/);return `${p[0]}-${String(p[1]).padStart(2,'0')}-${String(p[2]).padStart(2,'0')}`}if(/^\d{8}$/.test(v))return `${v.slice(0,4)}-${v.slice(4,6)}-${v.slice(6,8)}`;return v}
function parseAmount(v){const n=Number(String(v||'').replace(/[¥￥,\s]/g,''));return Number.isFinite(n)?Math.abs(n):0}
function importCSV(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const rows=csvParse(reader.result);if(rows.length<2)throw new Error('データがありません');const headers=rows[0].map(x=>x.trim().replace(/^"|"$/g,''));const find=(names)=>{const i=headers.findIndex(h=>names.includes(h.toLowerCase()));return i};const dateI=find(['日付','date']),amountI=find(['金額','amount']),categoryI=find(['カテゴリ','category']),typeI=find(['種別','type']),noteI=find(['メモ','note','内容','摘要']);if(dateI<0||amountI<0)throw new Error('日付・金額列が見つかりません');const imported=[];for(let i=1;i<rows.length;i++){const r=rows[i],date=normalizeDate(r[dateI]),amount=parseAmount(r[amountI]);if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!amount)continue;let type=String(r[typeI]||'').trim().toLowerCase();type=type==='収入'||type==='income'||type==='入金'?'income':'expense';const category=String(r[categoryI]||'その他').trim()||'その他';const note=String(r[noteI]||'').trim();imported.push({id:Date.now()+i,date,amount,category,type,note})}if(!imported.length)throw new Error('取り込める明細がありません');const ok=confirm(`${imported.length}件の明細を取り込みます。\n現在のデータは残したまま追加します。`);if(ok){records.push(...imported);localStorage.setItem('kakeibo','[]');localStorage.setItem('kakeibo',JSON.stringify(records));render();alert(`${imported.length}件取り込みました！`)}}catch(err){alert('CSVを読み込めませんでした。\n\n対応形式：日付,金額,カテゴリ,種別,メモ\n\n'+(err.message||''))}e.target.value=''};reader.readAsText(file,'UTF-8')}
function exportCSV(){const rows=[['日付','金額','カテゴリ','種別','メモ'],...selected().map(r=>[r.date,r.amount,r.category,r.type==='income'?'収入':'支出',r.note||''])];const csv=rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`kakeibo-${$('month').value}.csv`;a.click();URL.revokeObjectURL(a.href)}function clearAll(){if(confirm('全データを削除します。本当に実行しますか？')){records=[];localStorage.setItem('kakeibo','[]');render();closeSettings()}}
async function requestNotify(){if(!('Notification'in window)){alert('この端末・ブラウザは通知に対応していません');return}const p=await Notification.requestPermission();alert(p==='granted'?'通知を許可しました（定時通知にはサーバーが必要です）':'通知は許可されませんでした')}function changePin(){const current=settings.pin||'';if(current&&prompt('現在のPINを入力')!==current){alert('PINが違います');return}const p=prompt('新しいPINを4〜6桁で入力（空欄で解除）')||'';if(p&&!/^\d{4,6}$/.test(p)){alert('PINは数字4〜6桁です');return}settings.pin=p;localStorage.setItem('kakeiboSettings',JSON.stringify(settings));alert(p?'PINロックを設定しました':'PINロックを解除しました')}function unlock(){if($('unlockPin').value===settings.pin){$('lockscreen').classList.add('hidden');$('unlockPin').value=''}else $('pinError').textContent='PINが違います'}if(settings.pin)$('lockscreen').classList.remove('hidden');if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.error));render();
</script></body></html>

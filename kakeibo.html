<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#333333">
  <link rel="manifest" href="manifest.json">
  <title>ともやの家計簿</title>

  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background:#f5f5f5; margin:0; padding:20px; color:#333; }
    .app { max-width:850px; margin:auto; background:#fff; padding:24px; border-radius:18px; box-shadow:0 4px 18px #0001; }
    h1 { text-align:center; }
    .toolbar { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:16px 0; }
    .toolbar input,.toolbar button,form input,form select,form button { padding:10px; border:1px solid #ddd; border-radius:8px; font-size:15px; }
    button { cursor:pointer; background:#333; color:white; }
    .summary { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:20px 0; }
    .card { padding:14px; border-radius:12px; background:#f0f0f0; text-align:center; }
    .income { color:#16803c; } .expense { color:#c0392b; } .balance { color:#2455a4; } .invest { color:#7950a8; }
    form { display:grid; grid-template-columns:1fr 1fr 1fr auto; gap:8px; margin:20px 0; }
    .section { margin-top:28px; }
    .chart-wrap { width:100%; max-width:520px; margin:auto; display:flex; justify-content:center; overflow:hidden; }
    .chart-wrap canvas { display:block; width:100%; height:auto; max-height:520px; }
    .item { display:grid; grid-template-columns:100px 1fr auto auto; gap:10px; align-items:center; padding:11px 4px; border-bottom:1px solid #eee; }
    .item button { padding:6px 9px; } .edit { background:#666; } .delete { background:#eee; color:#333; }
    .empty { text-align:center; color:#888; padding:20px; }
    @media(max-width:650px){ .app{padding:16px;} .summary{grid-template-columns:1fr 1fr;} form{grid-template-columns:1fr 1fr;} .add{grid-column:span 2;} .item{grid-template-columns:1fr auto;} .chart-wrap{max-width:100%;} }
  </style>
</head>
<body>
  <div class="app">
    <h1>💰 ともやの家計簿</h1>

    <div class="toolbar">
      <label>対象月 <input id="month" type="month"></label>
      <button onclick="exportCSV()">CSV出力</button>
      <button onclick="clearAll()">全データ削除</button>
    </div>

    <div class="summary">
      <div class="card income">収入<br><strong id="income">¥0</strong></div>
      <div class="card expense">支出<br><strong id="expense">¥0</strong></div>
      <div class="card balance">残り<br><strong id="balance">¥0</strong></div>
      <div class="card invest">投資<br><strong id="investment">¥0</strong></div>
    </div>

    <form id="form">
      <input id="date" type="date" required>
      <input id="amount" type="number" min="1" placeholder="金額" required>
      <select id="category"><option>食費</option><option>家賃</option><option>光熱費</option><option>交通費</option><option>趣味</option><option>日用品</option><option>投資</option><option>その他</option></select>
      <select id="type"><option value="expense">支出</option><option value="income">収入</option></select>
      <button class="add">追加</button>
    </form>

    <div class="section"><h2>📊 カテゴリ別支出</h2><div class="chart-wrap"><canvas id="chart"></canvas></div></div>
    <div class="section"><h2>🧾 明細</h2><div id="list"></div></div>
  </div>

  <script>
    // 家計簿データをブラウザから読み込む
    let records = JSON.parse(localStorage.getItem('kakeibo') || '[]');
    let editingId = null;
    const yen = number => '¥' + number.toLocaleString('ja-JP');
    const today = new Date();
    const iso = date => date.toISOString().slice(0,10);

    date.value = iso(today);
    month.value = iso(today).slice(0,7);

    // 選択中の月だけ取得
    function selected() {
      return records.filter(record => record.date.startsWith(month.value));
    }

    // 保存して画面更新
    function save() {
      localStorage.setItem('kakeibo', JSON.stringify(records));
      render();
    }

    // 画面を更新
    function render() {
      const rows = selected();
      const incomeTotal = rows.filter(r => r.type === 'income').reduce((sum,r) => sum + r.amount, 0);
      const expenseTotal = rows.filter(r => r.type === 'expense').reduce((sum,r) => sum + r.amount, 0);
      const investmentTotal = rows.filter(r => r.category === '投資').reduce((sum,r) => sum + r.amount, 0);

      income.textContent = yen(incomeTotal);
      expense.textContent = yen(expenseTotal);
      balance.textContent = yen(incomeTotal - expenseTotal);
      investment.textContent = yen(investmentTotal);

      list.innerHTML = rows.length ? rows.slice().reverse().map(record => `
        <div class="item">
          <small>${record.date}</small>
          <span>${record.category}　${record.type === 'income' ? '＋' : '−'}${yen(record.amount)}</span>
          <button class="edit" onclick="editRecord(${record.id})">編集</button>
          <button class="delete" onclick="removeRecord(${record.id})">削除</button>
        </div>`).join('') : '<div class="empty">この月の記録はありません</div>';

      drawChart(rows.filter(record => record.type === 'expense'));
    }

    // 円グラフを描画
    function drawChart(rows) {
      const canvas = document.getElementById('chart');
      const ctx = canvas.getContext('2d');
      const width = Math.min(canvas.parentElement.clientWidth, 520);
      const height = 360;
      const dpr = window.devicePixelRatio || 1;

      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      ctx.setTransform(dpr,0,0,dpr,0,0);
      ctx.clearRect(0,0,width,height);

      const totals = {};
      rows.forEach(r => totals[r.category] = (totals[r.category] || 0) + r.amount);
      const entries = Object.entries(totals);

      if (!entries.length) {
        ctx.fillStyle = '#888'; ctx.font = '18px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('データなし', width/2, height/2);
        return;
      }

      const total = entries.reduce((sum,[,amount]) => sum + amount, 0);
      const cx = width/2, cy = 145, radius = Math.min(105,width*0.25);
      let start = -Math.PI/2;

      entries.forEach(([category,amount],index) => {
        const angle = amount / total * Math.PI * 2;
        ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,radius,start,start+angle); ctx.closePath();
        ctx.fillStyle = `hsl(${index*55},65%,55%)`; ctx.fill(); start += angle;
      });

      ctx.fillStyle='#333'; ctx.font='bold 18px sans-serif'; ctx.textAlign='center'; ctx.fillText(yen(total),cx,cy+7);
      ctx.textAlign='left'; ctx.font='14px sans-serif';
      entries.forEach(([category,amount],index) => { ctx.fillStyle='#333'; ctx.fillText(`${category}: ${yen(amount)}`,20,285+index*22); });
    }

    // 追加・編集
    form.addEventListener('submit', event => {
      event.preventDefault();
      const data = {date:date.value, amount:Number(amount.value), category:category.value, type:type.value};

      if (editingId) {
        Object.assign(records.find(r => r.id === editingId), data);
        editingId = null;
        document.querySelector('.add').textContent = '追加';
      } else {
        records.push({id:Date.now(), ...data});
      }

      event.target.reset();
      date.value = iso(today);
      save();
    });

    function editRecord(id) {
      const record = records.find(r => r.id === id);
      date.value = record.date; amount.value = record.amount; category.value = record.category; type.value = record.type;
      editingId = id; document.querySelector('.add').textContent = '更新';
      window.scrollTo({top:0,behavior:'smooth'});
    }

    function removeRecord(id) {
      records = records.filter(record => record.id !== id);
      save();
    }

    function exportCSV() {
      const rows = selected();
      const csv = '日付,金額,カテゴリ,種別\n' + rows.map(r => `${r.date},${r.amount},${r.category},${r.type === 'income' ? '収入' : '支出'}`).join('\n');
      const blob = new Blob(['\ufeff' + csv], {type:'text/csv'});
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob); link.download = `kakeibo-${month.value}.csv`; link.click();
      URL.revokeObjectURL(link.href);
    }

    function clearAll() {
      if (confirm('全データを削除しますか？')) { records = []; save(); }
    }

    month.addEventListener('change', render);
    window.addEventListener('resize', render);
    render();
  </script>
</body>
</html>
